<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d"><title id="t">Two ways to get routing wrong, one way to get it right</title><desc id="d">Three cards compare the biggest model everywhere, the cheapest model everywhere, and routing by task, on spend, speed and rework risk.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFC83B"/></marker></defs><rect width="1200" height="600" fill="#0F0F0F"/><text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Two habits that fail, one system that works</text><rect x="40.0" y="70.0" width="56.0" height="4.0" rx="2" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="40.0" y="102.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#888888" text-anchor="start">A qualitative comparison of trade-offs. These bars are an illustration, not measured data.</text><rect x="40.0" y="140.0" width="346.0" height="380.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="68.0" y="192.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Biggest model everywhere</text><text x="68.0" y="222.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#888888" text-anchor="start">Feels safe</text><text x="68.0" y="275.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Spend</text><rect x="68.0" y="289.0" width="54.0" height="16.0" rx="4" fill="#FFFFFF" stroke="#888888" stroke-width="1.2"/><rect x="130.0" y="289.0" width="54.0" height="16.0" rx="4" fill=