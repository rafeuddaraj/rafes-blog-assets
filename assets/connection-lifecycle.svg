<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="60" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="60" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">TCP Handshake</text>
    <path d="M 120 30 L 160 30" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
    
    <rect x="170" y="0" width="120" height="60" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="230" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">TLS Setup</text>
    <path d="M 290 30 L 330 30" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
    
    <rect x="340" y="0" width="120" height="60" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="400" y="35" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Authentication</text>
    <path d="M 460 30 L 500 30" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
    
    <rect x="510" y="0" width="150" height="60" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="2"/>
    <text x="585" y="35" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Session Allocated</text>
  </g>
  <text x="400" y="200" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Creating a new connection is a highly expensive multi-step process</text>
  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B"/>
    </marker>
  </defs>
</svg>
