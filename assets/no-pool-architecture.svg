  <text x="175" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">App (No Pool)</text>
  <rect x="550" y="50" width="150" height="300" rx="8" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2"/>
