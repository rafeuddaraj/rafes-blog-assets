<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d"><title id="t">Escalation flow</title><desc id="d">A flowchart for deciding when to retry, move up one model tier, or hand the task to a human.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFC83B"/></marker></defs><rect width="1200" height="900" fill="#0F0F0F"/><text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Escalation flow: retry smart, climb one tier, then call a human</text><rect x="40.0" y="70.0" width="56.0" height="4.0" rx="2" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="40.0" y="102.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#888888" text-anchor="start">Improve the context before you blame the model. Climb one tier at a time. A person is the last tier.</text><rect x="450.0" y="124.0" width="300.0" height="52.0" rx="12" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="600.0" y="155.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Task arrives</text><rect x="390.0" y="210.0" width="420.0" height="60.0" rx="12" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="600.0" y="245.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Classify: risk, ambiguity, how often it runs</text><rect x="420.0" y="304.0" width="360.0" height="52.0" rx="12" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="600.0" y="335.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pick the starting tier</text><rect x="390.0" y="390.0" width="420.0" height="60.0" rx="12" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="600.0" y="425.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Attempt with a spec and a handoff packet</text><path d="M600 475.0 L780.0 535 L600 595.0 L420.0 535 Z" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="600.0" y="531.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Tests, a real run and</text><text x="600.0" y="549.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">review pass?</text><path d="M600 625.0 L800.0 690 L600 755.0 L400.0 690 Z" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="600.0" y="686.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Failed twice here, or broke a</text><text x="600.0" y="704.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">rule, or invented facts?</text><rect x="450.0" y="778.0" width="300.0" height="44.0" rx="12" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="600.0" y="805.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Move up one tier</text><line x1="600.0" y1="176.0" x2="600.0" y2="210.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="600.0" y1="270.0" x2="600.0" y2="304.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="600.0" y1="356.0" x2="600.0" y2="390.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="600.0" y1="450.0" x2="600.0" y2="475.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="600.0" y1="595.0" x2="600.0" y2="625.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="600.0" y1="755.0" x2="600.0" y2="778.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><rect x="55.0" y="500.0" width="250.0" height="70.0" rx="12" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="180.0" y="530.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Accept. Write a Decision</text><text x="180.0" y="550.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Log entry.</text><line x1="420.0" y1="535.0" x2="305.0" y2="535.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="405.0" y="525.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="end">Yes</text><text x="612.0" y="612.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">No</text><path d="M800 690 L1010 690 L1010 420 L810 420" fill="none" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="1002.0" y="560.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="end">No: fix the context</text><text x="1002.0" y="578.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="end">and retry this tier</text><text x="612.0" y="770.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">Yes</text><path d="M450 800 L60 800 L60 420 L390 420" fill="none" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="76.0" y="640.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">Attempt again at the</text><text x="76.0" y="658.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">higher tier</text><rect x="800.0" y="770.0" width="360.0" height="60.0" rx="10" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 5"/><text x="980.0" y="796.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Already at the Strong tier?</text><text x="980.0" y="816.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="middle">A person takes over.</text><line x1="750.0" y1="800.0" x2="800.0" y2="800.0" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 4"/><text x="40.0" y="876.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Two failures is a starting default, not a law. Tune it with your Decision Log. Downgrade after repeated easy wins at a higher tier.</text></svg>
