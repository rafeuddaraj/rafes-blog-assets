<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="50" y="100" width="150" height="80" rx="8" fill="#1E1E1E" stroke="#FFC83B" stroke-width="2"/>
  <text x="125" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Payment Service</text>
  
  <rect x="600" y="100" width="150" height="80" rx="8" fill="#1E1E1E" stroke="#FFC83B" stroke-width="2"/>
  <text x="675" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Payment Gateway</text>

  <!-- Initial Request -->
  <path d="M 210 120 L 580 120" stroke="#FFC83B" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <polygon points="590,120 580,115 580,125" fill="#FFC83B"/>
  <text x="395" y="110" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">1. Request (Charge $100)</text>

  <!-- Processing Box -->
  <rect x="610" y="195" width="130" height="40" rx="4" fill="#333333" stroke="#888888" stroke-width="1"/>
  <text x="675" y="220" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Gateway charges $100</text>

  <!-- Lost Response -->
  <path d="M 590 160 L 400 160" stroke="#FF5555" stroke-width="2" fill="none"/>
  <line x1="390" y1="150" x2="410" y2="170" stroke="#FF5555" stroke-width="3"/>
  <line x1="410" y1="150" x2="390" y2="170" stroke="#FF5555" stroke-width="3"/>
  <text x="495" y="150" fill="#FF5555" font-family="sans-serif" font-size="14" text-anchor="middle">2. Network Drop</text>

  <!-- Retry Request -->
  <path d="M 210 240 L 580 240" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <polygon points="590,240 580,235 580,245" fill="#FFC83B"/>
  <text x="395" y="230" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">3. Retry Request (Charge $100)</text>

  <!-- Double Charge Consequence -->
  <rect x="610" y="290" width="130" height="40" rx="4" fill="#FF5555" stroke="#FFFFFF" stroke-width="1"/>
  <text x="675" y="315" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Gateway charges $200!</text>
</svg>
