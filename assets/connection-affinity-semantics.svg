<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="50" y="50" width="300" height="250" rx="8" fill="#1A1A1A" stroke="#00FF00" stroke-width="2"/>
  <text x="200" y="85" fill="#00FF00" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Correct: Single Connection</text>
  <text x="200" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Conn 1 -> BEGIN</text>
  <text x="200" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Conn 1 -> UPDATE</text>
  <text x="200" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Conn 1 -> COMMIT</text>
  <text x="200" y="260" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Transaction succeeds</text>
  
  <rect x="450" y="50" width="300" height="250" rx="8" fill="#1A1A1A" stroke="#FF3B3B" stroke-width="2"/>
  <text x="600" y="85" fill="#FF3B3B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Wrong: Mixed Connections</text>
  <text x="600" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Conn 1 -> BEGIN</text>
  <text x="600" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Conn 2 -> UPDATE (Fails)</text>
  <text x="600" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Conn 3 -> COMMIT (Fails)</text>
  <text x="600" y="260" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Transaction state lost / errors out</text>
</svg>
