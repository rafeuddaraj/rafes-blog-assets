<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  
  <rect x="50" y="100" width="100" height="50" rx="4" fill="#1E1E1E" stroke="#888888"/>
  <text x="100" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Client</text>

  <rect x="250" y="100" width="100" height="50" rx="4" fill="#1E1E1E" stroke="#888888"/>
  <text x="300" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Server</text>

  <rect x="450" y="100" width="100" height="50" rx="4" fill="#1E1E1E" stroke="#888888"/>
  <text x="500" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Database</text>

  <rect x="650" y="100" width="100" height="50" rx="4" fill="#1E1E1E" stroke="#888888"/>
  <text x="700" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Ext API</text>

  <!-- Connections with Failure Points -->
  <path d="M 160 125 L 240 125" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <circle cx="200" cy="125" r="8" fill="#FF5555"/>
  <text x="200" y="90" fill="#FF5555" font-family="sans-serif" font-size="10" text-anchor="middle">Net Fail</text>

  <path d="M 360 125 L 440 125" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <circle cx="400" cy="125" r="8" fill="#FF5555"/>
  <text x="400" y="90" fill="#FF5555" font-family="sans-serif" font-size="10" text-anchor="middle">DB Crash</text>

  <path d="M 300 160 L 300 180 L 650 180 L 650 160" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <circle cx="475" cy="180" r="8" fill="#FF5555"/>
  <text x="475" y="210" fill="#FF5555" font-family="sans-serif" font-size="10" text-anchor="middle">API Timeout</text>
</svg>
