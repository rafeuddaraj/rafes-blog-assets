<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0F0F0F; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Title -->
  <text x="400" y="35" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">REAL-WORLD LRU CACHE ARCHITECTURE</text>
  <text x="400" y="55" fill="#888888" font-size="13" text-anchor="middle">Combination of Hash Map O(1) Lookup and Doubly Linked List O(1) Eviction</text>

  <!-- Left: Hash Map -->
  <g transform="translate(50, 100)">
    <text x="80" y="-15" fill="#FFC83B" font-size="16" font-weight="bold" text-anchor="middle">Hash Map (Key -> Node)</text>
    <rect x="0" y="0" width="160" height="240" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2" rx="6" />

    <rect x="15" y="20" width="130" height="40" fill="#2A2A2A" rx="4" />
    <text x="80" y="45" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">"user_1" : 0x8A</text>

    <rect x="15" y="80" width="130" height="40" fill="#2A2A2A" rx="4" />
    <text x="80" y="105" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">"user_2" : 0x4B</text>

    <rect x="15" y="140" width="130" height="40" fill="#2A2A2A" rx="4" />
    <text x="80" y="165" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">"user_3" : 0x9C</text>

    <rect x="15" y="190" width="130" height="30" fill="none" stroke="#555555" stroke-dasharray="3,3" rx="4" />
    <text x="80" y="210" fill="#888888" font-size="12" text-anchor="middle">Empty Slot</text>
  </g>

  <!-- Right: Doubly Linked List -->
  <g transform="translate(300, 80)">
    <text x="220" y="-10" fill="#00E5FF" font-size="16" font-weight="bold" text-anchor="middle">Doubly Linked List (Order of Usage)</text>

    <!-- MRU Indicator -->
    <text x="45" y="20" fill="#00E5FF" font-size="12" font-weight="bold" text-anchor="middle">HEAD (MRU)</text>
    <text x="45" y="35" fill="#888888" font-size="11" text-anchor="middle">Most Recently Used</text>

    <!-- Node 1 (MRU) -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="90" height="60" fill="#1A1A1A" stroke="#00E5FF" stroke-width="2" rx="6" />
      <text x="45" y="25" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">user_1</text>
      <text x="45" y="45" fill="#888888" font-size="11" text-anchor="middle">Addr: 0x8A</text>
    </g>

    <!-- Arrows 1 to 2 -->
    <path d="M 90 70 L 140 70" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)" />
    <path d="M 140 90 L 90 90" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)" />

    <!-- Node 2 -->
    <g transform="translate(140, 50)">
      <rect x="0" y="0" width="90" height="60" fill="#1A1A1A" stroke="#00E5FF" stroke-width="2" rx="6" />
      <text x="45" y="25" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">user_3</text>
      <text x="45" y="45" fill="#888888" font-size="11" text-anchor="middle">Addr: 0x9C</text>
    </g>

    <!-- Arrows 2 to 3 -->
    <path d="M 230 70 L 280 70" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)" />
    <path d="M 280 90 L 230 90" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)" />

    <!-- Node 3 (LRU) -->
    <g transform="translate(280, 50)">
      <rect x="0" y="0" width="90" height="60" fill="#1A1A1A" stroke="#FF3B30" stroke-width="2" rx="6" />
      <text x="45" y="25" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">user_2</text>
      <text x="45" y="45" fill="#FF3B30" font-size="11" font-weight="bold" text-anchor="middle">Addr: 0x4B</text>
    </g>

    <!-- LRU Indicator -->
    <text x="325" y="20" fill="#FF3B30" font-size="12" font-weight="bold" text-anchor="middle">TAIL (LRU)</text>
    <text x="325" y="35" fill="#888888" font-size="11" text-anchor="middle">Least Recently Used</text>

    <!-- Eviction Arrow -->
    <path d="M 325 120 L 325 170" fill="none" stroke="#FF3B30" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-red-down)" />
    <text x="325" y="190" fill="#FF3B30" font-size="12" font-weight="bold" text-anchor="middle">Evicted When Cache Full</text>
  </g>

  <!-- Pointer Lines from Map to List -->
  <path d="M 180 140 Q 240 100 295 100" fill="none" stroke="#FFC83B" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-yellow)" />
  <path d="M 180 200 Q 250 200 435 115" fill="none" stroke="#FFC83B" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-yellow)" />

  <!-- Arrow Markers -->
  <defs>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B" />
    </marker>
    <marker id="arrow-red-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3B30" />
    </marker>
  </defs>
</svg>