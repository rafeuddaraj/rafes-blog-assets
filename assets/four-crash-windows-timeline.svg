<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="Tool call lifecycle with four crash windows W1 to W4">
<style>
.t{fill:#FFFFFF;font:13px Arial,Helvetica,sans-serif}
.g{fill:#888888;font:12px Arial,Helvetica,sans-serif}
.y{fill:#FFC83B;font:bold 13px Arial,Helvetica,sans-serif}
.k{fill:#0F0F0F;font:bold 12px Arial,Helvetica,sans-serif}
.n{fill:#0F0F0F;stroke:#FFFFFF;stroke-width:2}
.b{fill:#0F0F0F;stroke:#FFC83B;stroke-width:2}
.f{fill:#FFC83B;stroke:#FFC83B;stroke-width:2}
.m{stroke:#888888;stroke-width:2;fill:none}
</style>
<rect width="820" height="320" fill="#0F0F0F"/>
<text x="410" y="26" text-anchor="middle" class="y">Tool call lifecycle and the four crash windows</text>
<line x1="96" y1="150" x2="704" y2="150" class="m"/>
<circle cx="80" cy="150" r="16" class="n"/>
<circle cx="240" cy="150" r="16" class="n"/>
<circle cx="400" cy="150" r="16" class="n"/>
<circle cx="560" cy="150" r="16" class="n"/>
<circle cx="720" cy="150" r="16" class="n"/>
<circle cx="160" cy="150" r="12" class="b"/>
<circle cx="320" cy="150" r="12" class="b"/>
<circle cx="480" cy="150" r="17" class="f"/>
<circle cx="640" cy="150" r="12" class="b"/>
<text x="160" y="112" text-anchor="middle" class="y">W1</text>
<text x="320" y="112" text-anchor="middle" class="y">W2</text>
<text x="480" y="102" text-anchor="middle" class="y">W3 DANGER</text>
<text x="640" y="112" text-anchor="middle" class="y">W4</text>
<text x="80" y="195" text-anchor="middle" class="t">LLM picks</text>
<text x="80" y="212" text-anchor="middle" class="t">tool call</text>
<text x="240" y="195" text-anchor="middle" class="t">Append</text>
<text x="240" y="212" text-anchor="middle" class="t">TOOL_INVOKED</text>
<text x="400" y="195" text-anchor="middle" class="t">Effect commits</text>
<text x="400" y="212" text-anchor="middle" class="t">at provider</text>
<text x="560" y="195" text-anchor="middle" class="t">Append</text>
<text x="560" y="212" text-anchor="middle" class="t">TOOL_COMMITTED</text>
<text x="720" y="195" text-anchor="middle" class="t">Result returns</text>
<text x="720" y="212" text-anchor="middle" class="t">to LLM</text>
<text x="160" y="250" text-anchor="middle" class="g">nothing happened</text>
<text x="160" y="266" text-anchor="middle" class="g">yet</text>
<text x="320" y="250" text-anchor="middle" class="g">intent logged,</text>
<text x="320" y="266" text-anchor="middle" class="g">no effect yet</text>
<text x="480" y="250" text-anchor="middle" class="g">effect done,</text>
<text x="480" y="266" text-anchor="middle" class="g">no record</text>
<text x="640" y="250" text-anchor="middle" class="g">recorded, LLM</text>
<text x="640" y="266" text-anchor="middle" class="g">not told yet</text>
<text x="480" y="302" text-anchor="middle" class="y">Resume cannot tell if the effect happened</text>
</svg>
