<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0F0F0F; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 14px; font-weight: 600; fill: #FFC83B; }
      .node-text { font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .desc-text { font-size: 11px; fill: #AAAAAA; }
      .box { fill: #1A1A1A; stroke: #333333; stroke-width: 2; rx: 8; }
      .box-gateway { fill: #1F1A0C; stroke: #FFC83B; stroke-width: 2; rx: 8; }
      .box-service { fill: #141A1F; stroke: #4A90E2; stroke-width: 2; rx: 8; }
      .box-kafka { fill: #1A141F; stroke: #904AE2; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #666666; stroke-width: 2; marker-end: url(#arrow-gray-ms); }
      .arrow-sync { fill: none; stroke: #4A90E2; stroke-width: 2; marker-end: url(#arrow-blue-ms); }
      .arrow-async { fill: none; stroke: #904AE2; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#arrow-purple-ms); }
    </style>
    <marker id="arrow-gray-ms" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
    <marker id="arrow-blue-ms" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90E2" />
    </marker>
    <marker id="arrow-purple-ms" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#904AE2" />
    </marker>
  </defs>

  <text x="500" y="40" text-anchor="middle" class="title">FoodFast Microservices Ecosystem Data Flow</text>
  <text x="500" y="60" text-anchor="middle" class="subtitle">Synchronous (gRPC/REST) vs Asynchronous (Event-Driven Kafka) Communication</text>

  <!-- Client & API Gateway -->
  <rect x="50" y="220" width="120" height="60" class="box" />
  <text x="110" y="245" text-anchor="middle" class="node-text">Mobile / Web App</text>
  <text x="110" y="265" text-anchor="middle" class="desc-text">Client Requests</text>

  <path d="M 170 250 L 230 250" class="arrow" />

  <rect x="230" y="180" width="160" height="140" class="box-gateway" />
  <text x="310" y="235" text-anchor="middle" class="node-text" fill="#FFC83B">API Gateway Layer</text>
  <text x="310" y="255" text-anchor="middle" class="desc-text">Auth &amp; SSL Termination</text>
  <text x="310" y="275" text-anchor="middle" class="desc-text">Rate Limiting &amp; Routing</text>

  <!-- Synchronous Services -->
  <path d="M 390 220 L 470 140" class="arrow-sync" />
  <path d="M 390 280 L 470 340" class="arrow-sync" />

  <rect x="470" y="100" width="160" height="70" class="box-service" />
  <text x="550" y="130" text-anchor="middle" class="node-text" fill="#4A90E2">Auth Service</text>
  <text x="550" y="150" text-anchor="middle" class="desc-text">Sync gRPC / REST</text>

  <rect x="470" y="310" width="160" height="70" class="box-service" />
  <text x="550" y="340" text-anchor="middle" class="node-text" fill="#4A90E2">Order Service</text>
  <text x="550" y="360" text-anchor="middle" class="desc-text">Core Business Logic</text>

  <!-- Kafka Message Broker -->
  <path d="M 630 345 L 700 270" class="arrow-async" />
  <text x="670" y="320" class="desc-text" fill="#904AE2">Publish Event</text>

  <rect x="700" y="200" width="160" height="100" class="box-kafka" />
  <text x="780" y="240" text-anchor="middle" class="node-text" fill="#904AE2">Apache Kafka Cluster</text>
  <text x="780" y="260" text-anchor="middle" class="desc-text">Event Bus / Broker</text>
  <text x="780" y="280" text-anchor="middle" class="desc-text">OrderCreatedTopic</text>

  <!-- Asynchronous Consumers -->
  <path d="M 860 230 L 920 150" class="arrow-async" />
  <path d="M 860 270 L 920 350" class="arrow-async" />
  <text x="910" y="250" class="desc-text" fill="#904AE2">Subscribe / Consume</text>

  <rect x="870" y="80" width="110" height="70" class="box" />
  <text x="925" y="110" text-anchor="middle" class="node-text">Payment Service</text>
  <text x="925" y="130" text-anchor="middle" class="desc-text">Async Billing</text>

  <rect x="870" y="350" width="110" height="70" class="box" />
  <text x="925" y="380" text-anchor="middle" class="node-text">Notification Service</text>
  <text x="925" y="400" text-anchor="middle" class="desc-text">Email / SMS Push</text>

  <!-- Legend -->
  <rect x="250" y="450" width="500" height="40" fill="#141414" stroke="#333333" rx="5" />
  <line x1="270" y1="470" x2="310" y2="470" class="arrow-sync" />
  <text x="320" y="474" class="desc-text">Synchronous (gRPC / REST)</text>
  
  <line x1="490" y1="470" x2="530" y2="470" class="arrow-async" />
  <text x="540" y="474" class="desc-text">Asynchronous (Event-Driven / Kafka)</text>
</svg>