<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="50" y="30" width="700" height="180" rx="8" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
  <text x="400" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Request Timeout (e.g. 10s)</text>
  
  <rect x="100" y="80" width="600" height="110" rx="8" fill="#2A2A2A" stroke="#FFC83B" stroke-width="2"/>
  <text x="400" y="110" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Transaction Timeout (e.g. 5s)</text>
  
  <rect x="150" y="130" width="200" height="40" rx="4" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="250" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Pool Wait Timeout (e.g. 2s)</text>

  <rect x="400" y="130" width="250" height="40" rx="4" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="525" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Query Timeout (e.g. 3s)</text>
</svg>
