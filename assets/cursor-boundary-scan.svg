<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Cursor Boundary Range Scan</text>

  <!-- Ordered Dataset -->
  <rect x="50" y="100" width="700" height="60" fill="#111" stroke="#333" rx="4"/>
  
  <!-- Lines for rows -->
  <g stroke="#333" stroke-width="2">
    <line x1="100" y1="100" x2="100" y2="160"/>
    <line x1="150" y1="100" x2="150" y2="160"/>
    <line x1="200" y1="100" x2="200" y2="160"/>
    <line x1="250" y1="100" x2="250" y2="160"/>
    <line x1="300" y1="100" x2="300" y2="160"/>
    <line x1="500" y1="100" x2="500" y2="160"/>
  </g>

  <!-- Previous Page -->
  <text x="175" y="135" fill="#555" font-family="monospace" font-size="14" text-anchor="middle">Already Read</text>

  <!-- Cursor Boundary -->
  <line x1="300" y1="70" x2="300" y2="220" stroke="#FFC83B" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="240" y="230" width="120" height="30" fill="#2A2A00" stroke="#FFC83B" rx="4"/>
  <text x="300" y="250" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cursor = 9842</text>

  <!-- Next 20 rows -->
  <rect x="302" y="102" width="196" height="56" fill="#2A2A00" opacity="0.8"/>
  <text x="400" y="135" fill="#FFC83B" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">Range Scan (LIMIT 20)</text>

  <!-- Arrow -->
  <path d="M 305 180 L 480 180" stroke="#FFC83B" stroke-width="3" marker-end="url(#arrowYellow)"/>
  <defs>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B"/>
    </marker>
  </defs>
</svg>
