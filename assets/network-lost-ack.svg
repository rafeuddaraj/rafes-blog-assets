<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <circle cx="150" cy="150" r="50" fill="#1E1E1E" stroke="#FFC83B" stroke-width="3"/>
  <text x="150" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Producer</text>

  <circle cx="650" cy="150" r="50" fill="#1E1E1E" stroke="#FFC83B" stroke-width="3"/>
  <text x="650" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Consumer</text>

  <!-- Message Path -->
  <path d="M 210 130 C 350 80, 450 80, 590 130" stroke="#888888" stroke-width="2" fill="none"/>
  <polygon points="590,130 580,123 578,135" fill="#888888"/>
  <text x="400" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Message Delivered</text>
  <rect x="620" y="210" width="60" height="25" rx="4" fill="#333333" stroke="#888888"/>
  <text x="650" y="227" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle">Processed</text>

  <!-- ACK Path -->
  <path d="M 590 170 C 450 220, 350 220, 210 170" stroke="#FF5555" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <line x1="390" y1="185" x2="410" y2="205" stroke="#FF5555" stroke-width="3"/>
  <line x1="410" y1="185" x2="390" y2="205" stroke="#FF5555" stroke-width="3"/>
  <text x="400" y="225" fill="#FF5555" font-family="sans-serif" font-size="14" text-anchor="middle">ACK Lost (Network Failure)</text>
</svg>
