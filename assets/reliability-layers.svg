<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  
  <rect x="150" y="50" width="500" height="50" rx="4" fill="#333333" stroke="#888888" stroke-width="2"/>
  <text x="400" y="80" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1. Delivery Semantics (At-Least-Once)</text>

  <rect x="150" y="110" width="500" height="50" rx="4" fill="#333333" stroke="#888888" stroke-width="2"/>
  <text x="400" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2. Retries + Jitter &amp; Backoff</text>

  <rect x="150" y="170" width="500" height="50" rx="4" fill="#1E1E1E" stroke="#FFC83B" stroke-width="2"/>
  <text x="400" y="200" fill="#FFC83B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3. Inbox &amp; DB Unique Constraints</text>

  <rect x="150" y="230" width="500" height="50" rx="4" fill="#1E1E1E" stroke="#FFC83B" stroke-width="2"/>
  <text x="400" y="260" fill="#FFC83B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4. Transactional Outbox (Dual-write fix)</text>

  <rect x="150" y="290" width="500" height="50" rx="4" fill="#333333" stroke="#888888" stroke-width="2"/>
  <text x="400" y="320" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">5. Saga / Compensation logic</text>

  <text x="400" y="400" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Goal: Effectively Once Business Outcome</text>
</svg>
