<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Composite B-Tree Traversal</text>
  <text x="400" y="65" fill="#888" font-family="monospace" font-size="14" text-anchor="middle">Index (date, id)</text>

  <!-- Root Node -->
  <rect x="300" y="90" width="200" height="40" fill="#222" stroke="#555" rx="4"/>
  <text x="400" y="115" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">Root Node</text>

  <!-- Intermediate Nodes -->
  <line x1="400" y1="130" x2="200" y2="180" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="130" x2="600" y2="180" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="100" y="180" width="200" height="40" fill="#222" stroke="#555" rx="4"/>
  <rect x="500" y="180" width="200" height="40" fill="#222" stroke="#555" rx="4"/>

  <!-- Leaf Nodes (Data) -->
  <line x1="200" y1="220" x2="100" y2="280" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="220" x2="300" y2="280" stroke="#FFC83B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="250" y="280" width="100" height="40" fill="#2A2A00" stroke="#FFC83B" rx="4"/>
  <text x="300" y="305" fill="#FFC83B" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Cursor Target</text>

  <rect x="370" y="280" width="100" height="40" fill="#2A2A00" stroke="#FFC83B" rx="4"/>
  <rect x="490" y="280" width="100" height="40" fill="#2A2A00" stroke="#FFC83B" rx="4"/>
  
  <!-- Scan Arrow -->
  <path d="M 320 340 L 560 340" stroke="#FFC83B" stroke-width="3" marker-end="url(#arrowYellow)" stroke-dasharray="4,4"/>
  <text x="440" y="365" fill="#FFC83B" font-family="sans-serif" font-size="14" text-anchor="middle">Forward Range Scan (O(1))</text>
  
  <defs>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B"/>
    </marker>
  </defs>
</svg>
