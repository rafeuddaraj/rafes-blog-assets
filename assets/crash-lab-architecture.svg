</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFC83B"/></marker></defs>
<rect width="820" height="390" fill="#0F0F0F"/>
<text x="410" y="26" text-anchor="middle" class="y">Crash injection lab</text>
