<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="100" y="50" width="600" height="250" rx="8" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2"/>
  
  <text x="400" y="90" fill="#FFC83B" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">The Danger of State Reuse in Pools</text>
  
  <text x="150" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">1. Request A gets Conn 1</text>
  <text x="150" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">2. Request A runs: SET statement_timeout = '1min';</text>
  <text x="150" y="200" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">3. Request A releases Conn 1 back to Pool.</text>
  
  <text x="150" y="240" fill="#FF3B3B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start">4. Request B gets Conn 1.</text>
  <text x="150" y="270" fill="#FF3B3B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start">5. Request B silently inherits the 1min timeout!</text>
</svg>
