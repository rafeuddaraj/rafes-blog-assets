<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Planner, executor and reviewer pattern</title><desc id="d">Three swimlanes. A planner writes a spec, an executor implements and tests, a reviewer from a different model checks the diff, and a human decides.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFC83B"/></marker></defs><rect width="1200" height="640" fill="#0F0F0F"/><text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Planner, executor, reviewer</text><rect x="40.0" y="70.0" width="56.0" height="4.0" rx="2" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="40.0" y="102.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#888888" text-anchor="start">Three roles, ideally not the same model. Artifacts move between them, a human decides at the end.</text><rect x="40.0" y="140.0" width="1120.0" height="124.0" rx="14" fill="#171717" stroke="#3a3a3a" stroke-width="1.2"/><text x="64.0" y="192.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFC83B" text-anchor="start">PLANNER</text><text x="64.0" y="218.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Strong tier</text><rect x="40.0" y="280.0" width="1120.0" height="124.0" rx="14" fill="#171717" stroke="#3a3a3a" stroke-width="1.2"/><text x="64.0" y="332.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFC83B" text-anchor="start">EXECUTOR</text><text x="64.0" y="358.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Balanced or Fast tier</text><rect x="40.0" y="420.0" width="1120.0" height="124.0" rx="14" fill="#171717" stroke="#3a3a3a" stroke-width="1.2"/><text x="64.0" y="472.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFC83B" text-anchor="start">REVIEWER</text><text x="64.0" y="498.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Strong tier, different model</text><rect x="260.0" y="160.0" width="220.0" height="84.0" rx="12" fill="#1E1E1E" stroke="#FFFFFF" stroke-width="1.6"/><text x="280.0" y="196.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Write the plan</text><text x="280.0" y="222.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Spec and acceptance criteria</text><rect x="520.0" y="300.0" width="220.0" height="84.0" rx="12" fill="#1E1E1E" stroke="#FFFFFF" stroke-width="1.6"/><text x="540.0" y="336.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Implement and test</text><text x="540.0" y="362.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Run the tests, show the output</text><rect x="780.0" y="440.0" width="220.0" height="84.0" rx="12" fill="#1E1E1E" stroke="#FFFFFF" stroke-width="1.6"/><text x="800.0" y="476.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Review the diff</text><text x="800.0" y="502.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Check it against the spec</text><path d="M480 202.0 L630.0 202.0 L630.0 300" fill="none" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="640.0" y="196.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">Spec</text><path d="M740 342.0 L890.0 342.0 L890.0 440" fill="none" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="900.0" y="336.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">Diff and test output</text><path d="M780 482.0 L700 482.0 L700 384" fill="none" stroke="#FFC83B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="580.0" y="506.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="start">Review comments</text><path d="M1060 454 L1088 482 L1060 510 L1032 482 Z" fill="#FFC83B" stroke="#FFC83B" stroke-width="2"/><text x="1060.0" y="487.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">H</text><line x1="1000.0" y1="482.0" x2="1032.0" y2="482.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="1060.0" y="534.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="middle">Human gate</text><text x="1060.0" y="552.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#888888" text-anchor="middle">merge or send back</text><text x="40.0" y="616.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Skip this pattern for one-file fixes and quick scripts. It is overhead there. Use it when a mistake would be expensive to undo.</text></svg>
