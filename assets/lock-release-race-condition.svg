<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0F0F0F; font-family: monospace;">
    <rect width="800" height="450" fill="#0F0F0F" />
    
    <!-- Timelines -->
    <line x1="150" y1="50" x2="150" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="150" y="35" fill="#FFFFFF" font-size="16" text-anchor="middle" font-weight="bold">Worker A</text>
    
    <line x1="400" y1="50" x2="400" y2="400" stroke="#FFC83B" stroke-width="2"/>
    <text x="400" y="35" fill="#FFC83B" font-size="16" text-anchor="middle" font-weight="bold">Redis</text>
    
    <line x1="650" y1="50" x2="650" y2="400" stroke="#888888" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="650" y="35" fill="#FFFFFF" font-size="16" text-anchor="middle" font-weight="bold">Worker B</text>

    <!-- Events -->
    <!-- T1 -->
    <path d="M 150 80 L 400 100" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)"/>
    <text x="275" y="80" fill="#FFFFFF" font-size="12" text-anchor="middle">Acquires Lock (Token: X)</text>
    <rect x="380" y="100" width="40" height="90" fill="#FFC83B" fill-opacity="0.2" stroke="#FFC83B" stroke-width="1"/>
    <text x="430" y="150" fill="#FFC83B" font-size="12">Lock Owned by A</text>

    <!-- Pause -->
    <rect x="135" y="120" width="30" height="180" fill="#FF4444" fill-opacity="0.3" stroke="#FF4444" stroke-width="2"/>
    <text x="100" y="210" fill="#FF4444" font-size="14" font-weight="bold">PAUSED</text>

    <!-- Expire -->
    <line x1="380" y1="190" x2="420" y2="190" stroke="#FF4444" stroke-width="3"/>
    <text x="430" y="195" fill="#FF4444" font-size="12" font-weight="bold">Lock Expires (TTL)</text>

    <!-- B Acquires -->
    <path d="M 650 220 L 400 240" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)"/>
    <text x="525" y="220" fill="#FFFFFF" font-size="12" text-anchor="middle">Acquires Lock (Token: Y)</text>
    <rect x="380" y="240" width="40" height="120" fill="#00AAFF" fill-opacity="0.2" stroke="#00AAFF" stroke-width="1"/>
    <text x="430" y="280" fill="#00AAFF" font-size="12">Lock Owned by B</text>

    <!-- A Resumes and deletes -->
    <path d="M 150 320 L 400 340" stroke="#FF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="275" y="320" fill="#FF4444" font-size="12" text-anchor="middle" font-weight="bold">Blind DEL Command</text>
    
    <!-- Cross mark on B's Lock -->
    <path d="M 380 340 L 420 380 M 420 340 L 380 380" stroke="#FF4444" stroke-width="4"/>
    <text x="430" y="365" fill="#FF4444" font-size="12" font-weight="bold">B's Lock Deleted Unsafely!</text>

    <defs>
        <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#FFFFFF" />
        </marker>
        <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#FF4444" />
        </marker>
    </defs>
</svg>
