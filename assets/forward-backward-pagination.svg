<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Forward and Backward Traversal</text>

  <g transform="translate(150, 100)">
    <!-- Data Blocks -->
    <rect x="0" y="0" width="120" height="50" fill="#222" stroke="#888" rx="4"/>
    <text x="60" y="30" fill="#FFF" font-family="monospace" font-size="16" text-anchor="middle">Page 1</text>
    
    <rect x="190" y="0" width="120" height="50" fill="#2A2A00" stroke="#FFC83B" rx="4"/>
    <text x="250" y="30" fill="#FFC83B" font-family="monospace" font-size="16" text-anchor="middle">Current Page</text>

    <rect x="380" y="0" width="120" height="50" fill="#222" stroke="#888" rx="4"/>
    <text x="440" y="30" fill="#FFF" font-family="monospace" font-size="16" text-anchor="middle">Page 3</text>

    <!-- Forward Cursor -->
    <path d="M 315 25 L 370 25" stroke="#FFC83B" stroke-width="3" marker-end="url(#arrowYellow)"/>
    <text x="345" y="15" fill="#FFC83B" font-family="sans-serif" font-size="12" text-anchor="middle">next_cursor</text>
    <text x="345" y="45" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">id &lt; cursor</text>

    <!-- Backward Cursor -->
    <path d="M 185 25 L 130 25" stroke="#FF4444" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="155" y="15" fill="#FF4444" font-family="sans-serif" font-size="12" text-anchor="middle">prev_cursor</text>
    <text x="155" y="45" fill="#888" font-family="monospace" font-size="10" text-anchor="middle">id &gt; cursor</text>
  </g>

  <defs>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF4444"/>
    </marker>
  </defs>
</svg>
