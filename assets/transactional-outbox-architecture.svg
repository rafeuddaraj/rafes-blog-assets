<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0F0F0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Definitions for Arrowheads and Dropshadows -->
  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFC83B"/>
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00E5FF"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="40" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">TRANSACTIONAL OUTBOX ARCHITECTURE WORKFLOW</text>
  <text x="500" y="62" fill="#888888" font-size="13" text-anchor="middle">End-to-End Atomic Event Publishing &amp; Idempotent Processing</text>

  <!-- Container Box: Order Service (Producer) -->
  <rect x="40" y="90" width="280" height="390" rx="8" fill="#181818" stroke="#333333" stroke-width="2"/>
  <text x="180" y="120" fill="#FFC83B" font-size="14" font-weight="bold" text-anchor="middle">PRODUCER: ORDER SERVICE</text>

  <!-- Order Service Application -->
  <rect x="70" y="140" width="220" height="60" rx="6" fill="#222222" stroke="#FFC83B" stroke-width="1.5"/>
  <text x="180" y="165" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Order App Service</text>
  <text x="180" y="185" fill="#888888" font-size="11" text-anchor="middle">Executes Business Logic</text>

  <!-- Database Box -->
  <rect x="60" y="240" width="240" height="210" rx="6" fill="#202020" stroke="#444444" stroke-width="1.5"/>
  <text x="180" y="265" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Relational Database</text>
  <text x="180" y="280" fill="#FFC83B" font-size="10" text-anchor="middle">ACID Transaction (Single WAL)</text>

  <!-- Tables inside DB -->
  <rect x="80" y="300" width="200" height="50" rx="4" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="180" y="320" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">orders Table</text>
  <text x="180" y="338" fill="#888888" font-size="10" text-anchor="middle">INSERT INTO orders...</text>

  <rect x="80" y="380" width="200" height="50" rx="4" fill="#151515" stroke="#FFC83B" stroke-width="1.5"/>
  <text x="180" y="400" fill="#FFC83B" font-size="12" font-weight="bold" text-anchor="middle">outbox_messages Table</text>
  <text x="180" y="418" fill="#888888" font-size="10" text-anchor="middle">INSERT INTO outbox (PENDING)</text>

  <!-- Arrow from App to DB -->
  <path d="M 180 200 L 180 230" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="185" y="220" fill="#FFC83B" font-size="11" font-weight="bold">BEGIN TX</text>
  
  <!-- Internal DB Arrow -->
  <path d="M 180 350 L 180 370" stroke="#888888" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- CDC / Poller Engine Box -->
  <rect x="370" y="350" width="160" height="100" rx="8" fill="#181818" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="380" fill="#00E5FF" font-size="14" font-weight="bold" text-anchor="middle">CDC ENGINE</text>
  <text x="450" y="400" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">(Debezium / WAL)</text>
  <text x="450" y="420" fill="#888888" font-size="10" text-anchor="middle">Reads Logs Asynchronously</text>

  <!-- Arrow DB to CDC -->
  <path d="M 280 405 L 360 405" stroke="#00E5FF" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="320" y="395" fill="#00E5FF" font-size="11" text-anchor="middle">Read WAL</text>

  <!-- Message Broker Box -->
  <rect x="600" y="350" width="140" height="100" rx="8" fill="#181818" stroke="#FFC83B" stroke-width="2"/>
  <text x="670" y="390" fill="#FFC83B" font-size="14" font-weight="bold" text-anchor="middle">KAFKA BROKER</text>
  <text x="670" y="415" fill="#888888" font-size="11" text-anchor="middle">Topic: order-events</text>

  <!-- Arrow CDC to Broker -->
  <path d="M 530 400 L 590 400" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="560" y="390" fill="#FFFFFF" font-size="11" text-anchor="middle">Publish</text>

  <!-- Container Box: Consumer Service -->
  <rect x="780" y="90" width="180" height="390" rx="8" fill="#181818" stroke="#333333" stroke-width="2"/>
  <text x="870" y="120" fill="#FFC83B" font-size="14" font-weight="bold" text-anchor="middle">CONSUMER</text>

  <!-- Idempotency Layer -->
  <rect x="800" y="180" width="140" height="70" rx="6" fill="#222222" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="870" y="205" fill="#00E5FF" font-size="12" font-weight="bold" text-anchor="middle">Idempotency Guard</text>
  <text x="870" y="225" fill="#888888" font-size="10" text-anchor="middle">Check message_id</text>
  <text x="870" y="240" fill="#888888" font-size="10" text-anchor="middle">Drop if Duplicate</text>

  <!-- Consumer DB -->
  <rect x="800" y="320" width="140" height="130" rx="6" fill="#202020" stroke="#444444" stroke-width="1.5"/>
  <text x="870" y="345" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Consumer DB</text>
  <rect x="810" y="365" width="120" height="35" rx="3" fill="#151515" stroke="#00E5FF" stroke-width="1"/>
  <text x="870" y="387" fill="#00E5FF" font-size="10" font-weight="bold" text-anchor="middle">idempotent_table</text>
  <rect x="810" y="407" width="120" height="35" rx="3" fill="#151515" stroke="#666666" stroke-width="1"/>
  <text x="870" y="429" fill="#FFFFFF" font-size="10" text-anchor="middle">business_table</text>

  <!-- Arrow Broker to Consumer -->
  <path d="M 740 380 L 760 380 L 760 215 L 790 215" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="765" y="290" fill="#FFFFFF" font-size="11" transform="rotate(-90 765 290)">Consume Event</text>

  <!-- Arrow Idempotency to DB -->
  <path d="M 870 250 L 870 310" stroke="#00E5FF" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="875" y="285" fill="#00E5FF" font-size="11">Atomic Process</text>
</svg>