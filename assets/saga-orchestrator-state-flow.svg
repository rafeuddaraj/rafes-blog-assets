<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0F0F0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFC83B"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00E5FF"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF5252"/>
    </marker>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="35" fill="#FFFFFF" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">SAGA ORCHESTRATOR: FORWARD EXECUTION &amp; BACKWARD RECOVERY</text>
  <text x="500" y="55" fill="#888888" font-size="12" text-anchor="middle">Centralized State Machine Replay via Event Sourcing &amp; Compensating Triggers</text>

  <!-- Central Orchestrator Engine Box -->
  <rect x="320" y="80" width="360" height="150" rx="8" fill="#181818" stroke="#FFC83B" stroke-width="2"/>
  <text x="500" y="110" fill="#FFC83B" font-size="14" font-weight="bold" text-anchor="middle">SAGA ORCHESTRATOR ENGINE</text>
  <text x="500" y="128" fill="#FFFFFF" font-size="11" text-anchor="middle">(Temporal / Camunda State Machine)</text>

  <!-- Internal WAL / State Table inside Orchestrator -->
  <rect x="340" y="140" width="320" height="75" rx="4" fill="#111111" stroke="#444444" stroke-width="1"/>
  <text x="500" y="160" fill="#00E5FF" font-size="11" font-weight="bold" text-anchor="middle">Event Sourcing Log (WAL State Replay)</text>
  <text x="355" y="180" fill="#888888" font-size="10">1. [SUCCESS] Step 1: OrderStarted</text>
  <text x="355" y="195" fill="#888888" font-size="10">2. [SUCCESS] Step 2: PaymentBilled</text>
  <text x="355" y="210" fill="#FF5252" font-size="10" font-weight="bold">3. [FAILED] Step 3: InventoryOut -> TRIGGER ROLLBACK</text>

  <!-- Service 1: Order Service -->
  <rect x="50" y="320" width="220" height="130" rx="6" fill="#181818" stroke="#333333" stroke-width="2"/>
  <text x="160" y="345" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">1. Order Service</text>
  <rect x="70" y="360" width="180" height="35" rx="4" fill="#222222" stroke="#00E5FF" stroke-width="1"/>
  <text x="160" y="382" fill="#00E5FF" font-size="11" text-anchor="middle">Action: createOrder()</text>
  <rect x="70" y="402" width="180" height="35" rx="4" fill="#2A1515" stroke="#FF5252" stroke-width="1"/>
  <text x="160" y="424" fill="#FF5252" font-size="11" text-anchor="middle">Compensate: cancelOrder()</text>

  <!-- Service 2: Payment Service (Pivot) -->
  <rect x="390" y="320" width="220" height="130" rx="6" fill="#181818" stroke="#FFC83B" stroke-width="2"/>
  <text x="500" y="345" fill="#FFC83B" font-size="13" font-weight="bold" text-anchor="middle">2. Payment Service (Pivot)</text>
  <rect x="410" y="360" width="180" height="35" rx="4" fill="#222222" stroke="#00E5FF" stroke-width="1"/>
  <text x="500" y="382" fill="#00E5FF" font-size="11" text-anchor="middle">Action: chargeCard()</text>
  <rect x="410" y="402" width="180" height="35" rx="4" fill="#2A1515" stroke="#FF5252" stroke-width="1"/>
  <text x="500" y="424" fill="#FF5252" font-size="11" text-anchor="middle">Compensate: refundCard()</text>

  <!-- Service 3: Inventory Service (Failure Point) -->
  <rect x="730" y="320" width="220" height="130" rx="6" fill="#181818" stroke="#FF5252" stroke-width="2" filter="url(#glow-red)"/>
  <text x="840" y="345" fill="#FF5252" font-size="13" font-weight="bold" text-anchor="middle">3. Inventory Service</text>
  <rect x="750" y="360" width="180" height="35" rx="4" fill="#2A1515" stroke="#FF5252" stroke-width="1.5"/>
  <text x="840" y="382" fill="#FF5252" font-size="11" font-weight="bold" text-anchor="middle">Action: deductStock() [ERR]</text>
  <rect x="750" y="402" width="180" height="35" rx="4" fill="#1A1A1A" stroke="#555555" stroke-width="1"/>
  <text x="840" y="424" fill="#888888" font-size="11" text-anchor="middle">Compensate: N/A (Never ran)</text>

  <!-- Forward Actions Arrows (Cyan) -->
  <path d="M 370 230 L 160 320" stroke="#00E5FF" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="240" y="270" fill="#00E5FF" font-size="11" font-weight="bold">Step 1</text>

  <path d="M 500 230 L 500 320" stroke="#00E5FF" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="510" y="280" fill="#00E5FF" font-size="11" font-weight="bold">Step 2</text>

  <path d="M 630 230 L 840 320" stroke="#FF5252" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="4,4"/>
  <text x="760" y="270" fill="#FF5252" font-size="11" font-weight="bold">Step 3 (Fails)</text>

  <!-- Backward Recovery Arrows (Red) -->
  <path d="M 450 402 L 450 250 L 330 250 L 220 402" stroke="#FF5252" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
  <text x="310" y="310" fill="#FF5252" font-size="11" font-weight="bold">C1: Reverse Order</text>

  <path d="M 730 402 L 670 402 L 670 260 L 550 260 L 550 402" stroke="#FF5252" stroke-width="2" marker-end="url(#arrow-red)" fill="none"/>
  <text x="610" y="310" fill="#FF5252" font-size="11" font-weight="bold">C2: Reverse Payment</text>
</svg>
