<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d"><title id="t">Five axes for comparing models</title><desc id="d">A radar chart with five axes: reasoning depth, speed, cost efficiency, context handling and instruction following, with three illustrative model archetypes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFC83B"/></marker></defs><rect width="1200" height="720" fill="#0F0F0F"/><text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Five axes that matter when you compare models</text><rect x="40.0" y="70.0" width="56.0" height="4.0" rx="2" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="40.0" y="102.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#888888" text-anchor="start">Three archetypes for illustration. Score your own models from your own tests.</text><path d="M400.0 377.0 L440.9 406.7 L425.3 454.8 L374.7 454.8 L359.1 406.7 Z" fill="none" stroke="#3a3a3a" stroke-width="1"/><path d="M400.0 334.0 L481.8 393.4 L450.5 489.6 L349.5 489.6 L318.2 393.4 Z" fill="none" stroke="#3a3a3a" stroke-width="1"/><path d="M400.0 291.0 L522.7 380.1 L475.8 524.4 L324.2 524.4 L277.3 380.1 Z" fill="none" stroke="#3a3a3a" stroke-width="1"/><path d="M400.0 248.0 L563.6 366.8 L501.1 559.2 L298.9 559.2 L236.4 366.8 Z" fill="none" stroke="#3a3a3a" stroke-width="1"/><path d="M400.0 205.0 L604.5 353.6 L526.4 593.9 L273.6 593.9 L195.5 353.6 Z" fill="none" stroke="#888888" stroke-width="1.2"/><line x1="400.0" y1="420.0" x2="400.0" y2="205.0" stroke="#3a3a3a" stroke-width="1"/><text x="400.0" y="177.8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reasoning depth</text><line x1="400.0" y1="420.0" x2="604.5" y2="353.6" stroke="#3a3a3a" stroke-width="1"/><text x="635.1" y="348.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Speed</text><line x1="400.0" y1="420.0" x2="526.4" y2="593.9" stroke="#3a3a3a" stroke-width="1"/><text x="545.3" y="625.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Cost efficiency</text><line x1="400.0" y1="420.0" x2="273.6" y2="593.9" stroke="#3a3a3a" stroke-width="1"/><text x="254.7" y="616.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">Context</text><text x="254.7" y="635.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">handling</text><line x1="400.0" y1="420.0" x2="195.5" y2="353.6" stroke="#3a3a3a" stroke-width="1"/><text x="164.9" y="339.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">Instruction</text><text x="164.9" y="358.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="end">following</text><path d="M400.0 205.0 L481.8 393.4 L437.9 472.2 L298.9 559.2 L236.4 366.8 Z" fill="#FFC83B" fill-opacity="0.16" stroke="#FFC83B" stroke-width="2.6"/><circle cx="400.0" cy="205.0" r="4" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="481.8" cy="393.4" r="4" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="437.9" cy="472.2" r="4" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="298.9" cy="559.2" r="4" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="236.4" cy="366.8" r="4" fill="#FFC83B" stroke="none" stroke-width="1.5"/><path d="M400.0 269.5 L543.1 373.5 L475.8 524.4 L298.9 559.2 L256.9 373.5 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2"/><circle cx="400.0" cy="269.5" r="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><circle cx="543.1" cy="373.5" r="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><circle cx="475.8" cy="524.4" r="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><circle cx="298.9" cy="559.2" r="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><circle cx="256.9" cy="373.5" r="4" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><path d="M400.0 334.0 L604.5 353.6 L526.4 593.9 L324.2 524.4 L277.3 380.1 Z" fill="none" stroke="#888888" stroke-width="2.2" stroke-dasharray="7 5"/><circle cx="400.0" cy="334.0" r="4" fill="#888888" stroke="none" stroke-width="1.5"/><circle cx="604.5" cy="353.6" r="4" fill="#888888" stroke="none" stroke-width="1.5"/><circle cx="526.4" cy="593.9" r="4" fill="#888888" stroke="none" stroke-width="1.5"/><circle cx="324.2" cy="524.4" r="4" fill="#888888" stroke="none" stroke-width="1.5"/><circle cx="277.3" cy="380.1" r="4" fill="#888888" stroke="none" stroke-width="1.5"/><rect x="760.0" y="150.0" width="400.0" height="470.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="784.0" y="190.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">How to read it</text><line x1="784.0" y1="221.0" x2="824.0" y2="221.0" stroke="#FFC83B" stroke-width="3"/><text x="836.0" y="226.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Deep thinker</text><line x1="784.0" y1="253.0" x2="824.0" y2="253.0" stroke="#FFFFFF" stroke-width="3"/><text x="836.0" y="258.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Balanced</text><line x1="784.0" y1="285.0" x2="824.0" y2="285.0" stroke="#888888" stroke-width="3" stroke-dasharray="7 5"/><text x="836.0" y="290.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="start">Fast worker</text><line x1="784.0" y1="314.0" x2="1136.0" y2="314.0" stroke="#3a3a3a" stroke-width="1"/><text x="784.0" y="344.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="start">Reasoning depth</text><text x="784.0" y="364.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">How well it breaks down hard problems, and how</text><text x="784.0" y="382.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">much thinking you can dial.</text><text x="784.0" y="414.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="start">Cost efficiency</text><text x="784.0" y="434.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Higher means cheaper per accepted result, not only</text><text x="784.0" y="452.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">per token.</text><text x="784.0" y="484.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="start">Context handling</text><text x="784.0" y="504.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Accuracy as the input grows, not the advertised</text><text x="784.0" y="522.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">window size.</text><text x="784.0" y="554.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="start">Instruction following</text><text x="784.0" y="574.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Obeys your rules, stays concise, does not wander</text><text x="784.0" y="592.2" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">off.</text><text x="40.0" y="696.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Illustration only. The shapes are archetypes, not measurements of any real model. Score yours with routing-kit/02-model-test-template.md.</text></svg>
