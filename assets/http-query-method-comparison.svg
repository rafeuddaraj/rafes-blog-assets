<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%" style="background-color: #0F0F0F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #888888; text-anchor: middle; }
    .col-header { font-size: 16px; font-weight: 700; text-anchor: middle; }
    .box-text-main { font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
    .box-text-sub { font-size: 12px; font-weight: 400; fill: #888888; text-anchor: middle; }
    .status-badge { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .solid-arrow { fill: none; stroke-width: 2; }
    .layer-box { fill: #1A1A1A; stroke: #333333; stroke-width: 1.5; rx: 8; }
    .highlight-box { fill: #1F1A0C; stroke: #FFC83B; stroke-width: 2; rx: 8; }
    .rfc-badge { font-size: 11px; font-weight: 700; fill: #0F0F0F; text-anchor: middle; }
  </style>

  <text x="450" y="40" class="title">HTTP Method Semantic Comparison</text>
  <text x="450" y="60" class="subtitle">Architectural difference between GET, POST, and RFC 10008 (QUERY method)</text>

  <g transform="translate(40, 100)">
    <rect width="250" height="380" fill="#141414" stroke="#222222" stroke-width="1" rx="10" />
    <text x="125" y="35" class="col-header" fill="#61DAFB">GET Method</text>

    <rect x="25" y="60" width="200" height="60" class="layer-box" />
    <text x="125" y="85" class="box-text-main">URL Query String</text>
    <text x="125" y="105" class="box-text-sub">No Request Body</text>

    <path d="M 125 120 L 125 150" stroke="#61DAFB" class="solid-arrow" marker-end="url(#arrow-blue)" />

    <rect x="25" y="160" width="200" height="70" class="layer-box" />
    <text x="125" y="190" class="box-text-main">CDN / Cache Layer</text>
    <text x="125" y="210" fill="#4BB543" class="status-badge">CACHE HIT (Safe)</text>

    <path d="M 125 230 L 125 260" stroke="#61DAFB" class="solid-arrow" marker-end="url(#arrow-blue)" />

    <rect x="25" y="270" width="200" height="70" class="layer-box" />
    <text x="125" y="300" class="box-text-main">Database Read</text>
    <text x="125" y="320" class="box-text-sub">Idempotent, Read-Only</text>
  </g>

  <g transform="translate(325, 100)">
    <rect width="250" height="380" fill="#141414" stroke="#222222" stroke-width="1" rx="10" />
    <text x="125" y="35" class="col-header" fill="#FF5722">POST Method</text>

    <rect x="25" y="60" width="200" height="60" class="layer-box" />
    <text x="125" y="85" class="box-text-main">JSON Request Body</text>
    <text x="125" y="105" class="box-text-sub">Complex Payload Supported</text>

    <path d="M 125 120 L 125 150" stroke="#FF5722" class="solid-arrow" marker-end="url(#arrow-red)" />

    <rect x="25" y="160" width="200" height="70" class="layer-box" />
    <text x="125" y="190" class="box-text-main">CDN / Cache Layer</text>
    <text x="125" y="210" fill="#FF5722" class="status-badge">CACHE BYPASSED</text>

    <path d="M 125 230 L 125 260" stroke="#FF5722" class="solid-arrow" marker-end="url(#arrow-red)" />

    <rect x="25" y="270" width="200" height="70" class="layer-box" />
    <text x="125" y="300" class="box-text-main">Database Mutation</text>
    <text x="125" y="320" class="box-text-sub">Creates or Updates State</text>
  </g>

  <g transform="translate(610, 100)">
    <rect width="250" height="380" fill="#18150A" stroke="#FFC83B" stroke-width="1.5" rx="10" />
    <text x="125" y="35" class="col-header" fill="#FFC83B">QUERY Method</text>

    <rect x="25" y="60" width="200" height="60" class="highlight-box" />
    <text x="125" y="85" class="box-text-main" fill="#FFC83B">JSON Request Body</text>
    <text x="125" y="105" class="box-text-sub">Clean Structured Filter</text>

    <path d="M 125 120 L 125 150" stroke="#FFC83B" class="solid-arrow" marker-end="url(#arrow-yellow)" />

    <rect x="25" y="160" width="200" height="70" class="highlight-box" />
    <text x="125" y="190" class="box-text-main" fill="#FFC83B">CDN / Cache Layer</text>
    <text x="125" y="210" fill="#4BB543" class="status-badge">CACHE HIT + Body</text>

    <path d="M 125 230 L 125 260" stroke="#FFC83B" class="solid-arrow" marker-end="url(#arrow-yellow)" />

    <rect x="25" y="270" width="200" height="70" class="highlight-box" />
    <text x="125" y="300" class="box-text-main" fill="#FFC83B">Database Read-Only</text>
    <text x="125" y="320" class="box-text-sub">Safe + Idempotent</text>
  </g>

  <rect x="325" y="500" width="250" height="34" rx="17" fill="#FFC83B" />
  <text x="450" y="522" class="rfc-badge">RFC 10008, Standardized June 2026</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61DAFB" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5722" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B" />
    </marker>
  </defs>
</svg>
