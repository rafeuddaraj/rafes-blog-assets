<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Distributed Cursor Merge Sort</text>

  <!-- Shards -->
  <rect x="100" y="80" width="100" height="60" fill="#222" stroke="#888" rx="8"/>
  <text x="150" y="115" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">DB Shard 1</text>
  
  <rect x="350" y="80" width="100" height="60" fill="#222" stroke="#888" rx="8"/>
  <text x="400" y="115" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">DB Shard 2</text>

  <rect x="600" y="80" width="100" height="60" fill="#222" stroke="#888" rx="8"/>
  <text x="650" y="115" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">DB Shard 3</text>

  <!-- Merge Layer -->
  <rect x="250" y="200" width="300" height="60" fill="#2A2A00" stroke="#FFC83B" rx="8"/>
  <text x="400" y="235" fill="#FFC83B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Merge Node (K-Way Merge)</text>

  <!-- Connections -->
  <path d="M 150 140 L 300 200" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 140 L 400 200" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 650 140 L 500 200" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="210" y="180" fill="#888" font-size="12">Top N</text>
  <text x="410" y="170" fill="#888" font-size="12">Top N</text>
  <text x="580" y="180" fill="#888" font-size="12">Top N</text>

  <!-- Output -->
  <path d="M 400 260 L 400 300" stroke="#FFC83B" stroke-width="3" marker-end="url(#arrowYellow)"/>
  <text x="400" y="325" fill="#FFF" font-family="monospace" font-size="14" text-anchor="middle">Global Sorted Result + Global Cursor</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B"/>
    </marker>
  </defs>
</svg>
