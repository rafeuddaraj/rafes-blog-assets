<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="100" y="50" width="600" height="300" rx="8" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
  <text x="400" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">PostgreSQL Server (Example)</text>
  
  <rect x="150" y="120" width="150" height="200" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="1"/>
  <text x="225" y="150" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Connection 1</text>
  <text x="225" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">OS Process / Thread</text>
  <text x="225" y="210" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Memory Context</text>
  <text x="225" y="240" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Temp Tables</text>
  
  <rect x="325" y="120" width="150" height="200" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="1"/>
  <text x="400" y="150" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Connection 2</text>
  <text x="400" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">OS Process / Thread</text>
  <text x="400" y="210" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Memory Context</text>
  <text x="400" y="240" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Temp Tables</text>
  
  <rect x="500" y="120" width="150" height="200" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="1"/>
  <text x="575" y="150" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Connection N</text>
  <text x="575" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">OS Process / Thread</text>
  <text x="575" y="210" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Memory Context</text>
  <text x="575" y="240" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Temp Tables</text>
</svg>
