<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="50" y="50" width="700" height="250" rx="8" fill="#1A1A1A" stroke="#FF3B3B" stroke-width="2"/>
  
  <text x="400" y="90" fill="#FF3B3B" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Serverless Traffic Spike (Connection Explosion)</text>
  
  <rect x="100" y="120" width="100" height="60" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="150" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Lambda 1 (Pool)</text>
  <rect x="220" y="120" width="100" height="60" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="270" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Lambda 2 (Pool)</text>
  <rect x="340" y="120" width="100" height="60" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="390" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Lambda N (Pool)</text>
  <text x="490" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">... x 1000s</text>

  <path d="M 270 190 L 400 240" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
  <path d="M 150 190 L 380 240" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
  <path d="M 390 190 L 410 240" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
  <path d="M 490 180 L 430 240" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>

  <rect x="350" y="250" width="100" height="40" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2"/>
  <text x="400" y="275" fill="#FFC83B" font-family="sans-serif" font-size="14" text-anchor="middle">Database</text>
  <text x="400" y="320" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Every function cold start tries to open a new DB connection, instantly crashing DB.</text>
</svg>
