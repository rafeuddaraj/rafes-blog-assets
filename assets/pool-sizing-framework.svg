<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="300" height="40" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="150" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Application Instances Count</text>
    <path d="M 150 40 L 150 70" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <rect x="0" y="70" width="300" height="40" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="150" y="95" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Traffic / Request Rate</text>
    <path d="M 150 110 L 150 140" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>

    <rect x="0" y="140" width="300" height="40" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="150" y="165" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Connection Hold Time</text>
    <path d="M 150 180 L 150 210" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>

    <rect x="0" y="210" width="300" height="40" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="150" y="235" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Database Global Capacity</text>
    <path d="M 150 250 L 150 280" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>

    <rect x="-50" y="280" width="400" height="60" rx="8" fill="#2A2A2A" stroke="#FFC83B" stroke-width="2"/>
    <text x="150" y="315" fill="#FFC83B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Calculated Ideal Pool Size per App</text>
    <path d="M 150 340 L 150 380" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>

    <rect x="-50" y="380" width="400" height="60" rx="8" fill="#1A1A1A" stroke="#00FF00" stroke-width="2"/>
    <text x="150" y="415" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Validate via Load Tests &amp; Metrics</text>
  </g>
</svg>
