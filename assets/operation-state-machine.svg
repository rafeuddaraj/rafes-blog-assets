<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" role="img" aria-label="Operation state machine with PENDING INVOKED COMMITTED FAILED and UNKNOWN states">
<style>
.t{fill:#FFFFFF;font:13px Arial,Helvetica,sans-serif}
.g{fill:#888888;font:12px Arial,Helvetica,sans-serif}
.y{fill:#FFC83B;font:bold 13px Arial,Helvetica,sans-serif}
.b{fill:#0F0F0F;stroke:#FFC83B;stroke-width:1.5}
.n{fill:#0F0F0F;stroke:#888888;stroke-width:1.5}
.l{stroke:#FFC83B;stroke-width:2;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FFC83B"/></marker></defs>
<rect width="820" height="420" fill="#0F0F0F"/>
<text x="410" y="28" text-anchor="middle" class="y">Operation state machine</text>
<rect x="30" y="70" width="130" height="50" rx="6" class="n"/><text x="95" y="100" text-anchor="middle" class="t">PENDING</text>
<rect x="240" y="70" width="130" height="50" rx="6" class="b"/><text x="305" y="100" text-anchor="middle" class="t">INVOKED</text>
<rect x="620" y="70" width="150" height="50" rx="6" class="b"/><text x="695" y="100" text-anchor="middle" class="y">COMMITTED</text>
<rect x="240" y="240" width="130" height="50" rx="6" class="b"/><text x="305" y="270" text-anchor="middle" class="y">UNKNOWN</text>
<rect x="620" y="240" width="150" height="50" rx="6" class="n"/><text x="695" y="270" text-anchor="middle" class="t">FAILED</text>
<rect x="140" y="340" width="330" height="40" rx="6" class="n"/><text x="305" y="365" text-anchor="middle" class="t">Human approval bound to exact call and args</text>
<line x1="160" y1="95" x2="238" y2="95" class="l" marker-end="url(#a)"/>
<text x="199" y="87" text-anchor="middle" class="g">claim key</text>
<line x1="370" y1="95" x2="618" y2="95" class="l" marker-end="url(#a)"/>
<text x="494" y="87" text-anchor="middle" class="g">provider confirms</text>
<line x1="305" y1="120" x2="305" y2="238" class="l" marker-end="url(#a)"/>
<text x="295" y="185" text-anchor="end" class="g">timeout or crash</text>
<path d="M355 240 L355 160 L695 160 L695 122" class="l" marker-end="url(#a)"/>
<text x="525" y="152" text-anchor="middle" class="g">lookup finds effect</text>
<line x1="370" y1="265" x2="618" y2="265" class="l" marker-end="url(#a)"/>
<text x="494" y="257" text-anchor="middle" class="g">lookup proves no effect</text>
<line x1="305" y1="290" x2="305" y2="338" class="l" marker-end="url(#a)"/>
<text x="315" y="320" class="g">no lookup API</text>
<text x="410" y="406" text-anchor="middle" class="g">INVOKED to FAILED: provider rejected the request before any effect (validation error)</text>
</svg>
