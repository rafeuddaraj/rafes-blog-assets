<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Mutable Ordering Shift (updated_at)</text>

  <!-- Initial State -->
  <text x="200" y="80" fill="#888" font-family="sans-serif" font-size="16" text-anchor="middle">Before Update</text>
  <rect x="150" y="100" width="100" height="30" fill="#2A2A00" stroke="#FFC83B"/>
  <text x="200" y="120" fill="#FFC83B" font-family="monospace">Record A</text>
  <rect x="150" y="130" width="100" height="30" fill="#2A2A00" stroke="#FFC83B"/>
  <text x="200" y="150" fill="#FFC83B" font-family="monospace">Record B</text>
  <rect x="150" y="160" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="200" y="180" fill="#FFF" font-family="monospace">Record C</text>
  <text x="200" y="210" fill="#FFC83B" font-family="sans-serif" font-size="12" text-anchor="middle">Cursor stops at B</text>

  <!-- Arrow -->
  <path d="M 320 150 L 450 150" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="140" fill="#FF4444" font-family="sans-serif" font-size="12" text-anchor="middle">Update C</text>

  <!-- Final State -->
  <text x="600" y="80" fill="#888" font-family="sans-serif" font-size="16" text-anchor="middle">After Update</text>
  <rect x="550" y="100" width="100" height="30" fill="#440000" stroke="#FF4444"/>
  <text x="600" y="120" fill="#FF4444" font-family="monospace">Record C</text>
  <rect x="550" y="130" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="600" y="150" fill="#FFF" font-family="monospace">Record A</text>
  <rect x="550" y="160" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="600" y="180" fill="#FFF" font-family="monospace">Record B</text>
  <rect x="550" y="190" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="600" y="210" fill="#FFF" font-family="monospace">Record D</text>
  
  <text x="600" y="240" fill="#FFC83B" font-family="sans-serif" font-size="12" text-anchor="middle">Next Cursor from B starts at D</text>
  <text x="600" y="260" fill="#FF4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Record C is skipped forever!</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
