<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Latency vs Pagination Depth</text>

  <!-- Axes -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#888" stroke-width="2"/>
  <line x1="100" y1="320" x2="100" y2="80" stroke="#888" stroke-width="2"/>
  
  <text x="400" y="360" fill="#888" font-family="sans-serif" font-size="14" text-anchor="middle">Row Depth (Records Traversed)</text>
  <text x="50" y="200" fill="#888" font-family="sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90, 50, 200)">Latency (ms)</text>

  <!-- Offset Line O(N) -->
  <path d="M 100 320 Q 400 300 700 100" fill="none" stroke="#FF4444" stroke-width="4"/>
  <text x="680" y="90" fill="#FF4444" font-family="sans-serif" font-size="14" font-weight="bold">Offset: O(N)</text>

  <!-- Cursor Line O(1) -->
  <path d="M 100 310 L 700 310" fill="none" stroke="#FFC83B" stroke-width="4"/>
  <text x="680" y="300" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold">Cursor: O(1)</text>

  <!-- Ticks -->
  <text x="100" y="340" fill="#555" font-size="12" text-anchor="middle">0</text>
  <text x="300" y="340" fill="#555" font-size="12" text-anchor="middle">100,000</text>
  <text x="500" y="340" fill="#555" font-size="12" text-anchor="middle">1,000,000</text>
  <text x="700" y="340" fill="#555" font-size="12" text-anchor="middle">5,000,000</text>
</svg>
