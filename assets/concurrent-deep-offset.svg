<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF4444"/>
    </marker>
  </defs>

  <!-- Users -->
  <circle cx="100" cy="100" r="20" fill="#888"/>
  <circle cx="100" cy="200" r="20" fill="#888"/>
  <circle cx="100" cy="300" r="20" fill="#888"/>
  <text x="100" y="140" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">User 1</text>
  <text x="100" y="240" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">User 2</text>
  <text x="100" y="340" fill="#FFF" font-family="sans-serif" font-size="12" text-anchor="middle">User N</text>

  <!-- API Layer -->
  <rect x="250" y="80" width="100" height="240" fill="#222" stroke="#FFC83B" rx="8"/>
  <text x="300" y="200" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle" transform="rotate(-90, 300, 200)">API Layer</text>

  <!-- Database -->
  <path d="M 550 120 C 650 120, 650 100, 550 100 C 450 100, 450 120, 550 120 L 550 280 C 650 280, 650 300, 550 300 C 450 300, 450 280, 550 280 Z" fill="#222" stroke="#FF4444" stroke-width="3"/>
  <text x="550" y="200" fill="#FFF" font-family="sans-serif" font-size="18" text-anchor="middle">Database</text>
  <text x="550" y="230" fill="#FF4444" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">High CPU Load</text>
  
  <!-- Connections -->
  <line x1="130" y1="100" x2="240" y2="120" stroke="#888" stroke-width="2"/>
  <line x1="130" y1="200" x2="240" y2="200" stroke="#888" stroke-width="2"/>
  <line x1="130" y1="300" x2="240" y2="280" stroke="#888" stroke-width="2"/>

  <line x1="360" y1="150" x2="460" y2="170" stroke="#FF4444" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="360" y1="200" x2="460" y2="200" stroke="#FF4444" stroke-width="3" marker-end="url(#arrowRed)"/>
  <line x1="360" y1="250" x2="460" y2="230" stroke="#FF4444" stroke-width="3" marker-end="url(#arrowRed)"/>
  
  <text x="410" y="150" fill="#FF4444" font-family="monospace" font-size="12" text-anchor="middle">OFFSET 1M</text>
</svg>
