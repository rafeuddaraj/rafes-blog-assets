<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <path d="M 100 350 L 700 350" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-rt)"/>
  <path d="M 100 350 L 100 50" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-up)"/>
  
  <text x="400" y="380" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Number of Database Connections (Pool Size)</text>
  <text x="40" y="200" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 40,200)">Performance (Throughput)</text>
  
  <path d="M 100 350 Q 250 100 400 100 Q 550 100 700 300" fill="none" stroke="#FFC83B" stroke-width="4"/>
  
  <line x1="400" y1="100" x2="400" y2="350" stroke="#888888" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="80" fill="#FFC83B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Saturation Point</text>
  
  <text x="250" y="250" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Throughput Gains</text>
  <text x="550" y="250" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Contention &amp; Overhead</text>
  
  <defs>
    <marker id="a-rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/></marker>
    <marker id="a-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 10 L 5 0 L 10 10 z" fill="#FFFFFF"/></marker>
  </defs>
</svg>
