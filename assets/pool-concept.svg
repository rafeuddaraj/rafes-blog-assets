<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="50" y="125" width="100" height="100" rx="8" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
  <text x="100" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="16" text-anchor="middle">Requests</text>
  
  <rect x="300" y="50" width="200" height="250" rx="8" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2"/>
  <text x="400" y="85" fill="#FFC83B" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Connection Pool</text>
  
  <rect x="330" y="110" width="140" height="40" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="400" y="135" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Connection 1</text>
  <rect x="330" y="160" width="140" height="40" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="400" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Connection 2</text>
  <rect x="330" y="210" width="140" height="40" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="400" y="235" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Connection 3</text>
  
  <rect x="650" y="125" width="100" height="100" rx="8" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
  <text x="700" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="16" text-anchor="middle">Database</text>
  
  <path d="M 150 150 L 290 150" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 290 200 L 150 200" stroke="#888888" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr-gray)"/>
  <text x="220" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Acquire</text>
  <text x="220" y="220" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Release</text>
  
  <path d="M 500 175 L 640 175" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arr)"/>
  <text x="570" y="165" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Execute</text>
  
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
