<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  
  <!-- Left Side: Ambiguous -->
  <text x="200" y="50" fill="#FF4444" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Ambiguous Ordering</text>
  <text x="200" y="75" fill="#888" font-family="monospace" font-size="14" text-anchor="middle">ORDER BY created_at DESC</text>
  
  <rect x="50" y="100" width="300" height="150" fill="#111" stroke="#FF4444" rx="4"/>
  <text x="100" y="130" fill="#FFF" font-family="monospace" font-size="14">ID: 5 | 10:00:00  &lt;- ?</text>
  <text x="100" y="170" fill="#FFF" font-family="monospace" font-size="14">ID: 4 | 10:00:00  &lt;- ?</text>
  <text x="100" y="210" fill="#FFF" font-family="monospace" font-size="14">ID: 3 | 10:00:00  &lt;- ?</text>
  <text x="200" y="280" fill="#FF4444" font-family="sans-serif" font-size="14" text-anchor="middle">Unpredictable Pagination</text>

  <!-- Right Side: Deterministic -->
  <text x="600" y="50" fill="#FFC83B" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Deterministic Ordering</text>
  <text x="600" y="75" fill="#888" font-family="monospace" font-size="14" text-anchor="middle">ORDER BY created_at DESC, id DESC</text>

  <rect x="450" y="100" width="300" height="150" fill="#111" stroke="#FFC83B" rx="4"/>
  <text x="500" y="130" fill="#FFF" font-family="monospace" font-size="14">ID: 5 | 10:00:00  (1st)</text>
  <text x="500" y="170" fill="#FFF" font-family="monospace" font-size="14">ID: 4 | 10:00:00  (2nd)</text>
  <text x="500" y="210" fill="#FFF" font-family="monospace" font-size="14">ID: 3 | 10:00:00  (3rd)</text>
  <text x="600" y="280" fill="#FFC83B" font-family="sans-serif" font-size="14" text-anchor="middle">Stable Boundary for Cursors</text>
</svg>
