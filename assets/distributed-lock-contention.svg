<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background-color: #0F0F0F; font-family: monospace;">
    <rect width="800" height="400" fill="#0F0F0F" />
    <!-- Application Instances -->
    <rect x="50" y="80" width="140" height="50" rx="6" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="120" y="110" fill="#FFFFFF" font-size="16" text-anchor="middle">Worker A</text>

    <rect x="50" y="270" width="140" height="50" rx="6" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="120" y="300" fill="#FFFFFF" font-size="16" text-anchor="middle">Worker B</text>

    <rect x="50" y="175" width="140" height="50" rx="6" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="120" y="205" fill="#888888" font-size="16" text-anchor="middle">Worker C</text>

    <!-- Redis Coordination -->
    <rect x="330" y="150" width="140" height="100" rx="10" fill="#2A2A2A" stroke="#FFC83B" stroke-width="3"/>
    <text x="400" y="195" fill="#FFC83B" font-size="18" font-weight="bold" text-anchor="middle">Redis Lock</text>
    <text x="400" y="220" fill="#888888" font-size="12" text-anchor="middle">Coordination Point</text>

    <!-- Critical Section -->
    <rect x="600" y="150" width="150" height="100" rx="6" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="675" y="195" fill="#FFFFFF" font-size="18" text-anchor="middle">Critical</text>
    <text x="675" y="220" fill="#FFFFFF" font-size="18" text-anchor="middle">Section</text>

    <!-- Arrows Worker to Redis -->
    <path d="M 190 105 L 330 170" stroke="#FFC83B" stroke-width="2" fill="none" marker-end="url(#arrow-yellow)"/>
    <path d="M 190 295 L 330 230" stroke="#FFC83B" stroke-width="2" fill="none" marker-end="url(#arrow-yellow)"/>
    
    <!-- Arrows Redis to DB -->
    <path d="M 470 200 L 600 200" stroke="#FFFFFF" stroke-width="3" fill="none" marker-end="url(#arrow-white)"/>

    <!-- Defs for Markers -->
    <defs>
        <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#FFC83B" />
        </marker>
        <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#FFFFFF" />
        </marker>
    </defs>
</svg>
