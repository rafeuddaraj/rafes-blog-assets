<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%" style="background-color: #0F0F0F; font-family: monospace;">
    <rect width="900" height="300" fill="#0F0F0F" />
    
    <!-- Title -->
    <text x="450" y="30" fill="#FFC83B" font-size="16" font-weight="bold" text-anchor="middle">Complete Fencing Sequence (Safety Preserved)</text>

    <!-- Horizontal Timeline Line -->
    <line x1="50" y1="150" x2="850" y2="150" stroke="#888888" stroke-width="3"/>
    
    <!-- Time Events -->
    <!-- T1 -->
    <circle cx="100" cy="150" r="6" fill="#FFFFFF"/>
    <text x="100" y="120" fill="#FFFFFF" font-size="12" text-anchor="middle">A gets Lock</text>
    <text x="100" y="180" fill="#888888" font-size="12" text-anchor="middle">Token=100</text>

    <!-- T2 -->
    <circle cx="220" cy="150" r="6" fill="#FF4444"/>
    <text x="220" y="120" fill="#FF4444" font-size="12" font-weight="bold" text-anchor="middle">A Paused</text>
    <text x="220" y="180" fill="#888888" font-size="12" text-anchor="middle">(GC/CPU)</text>

    <!-- T3 -->
    <circle cx="340" cy="150" r="6" fill="#FFC83B"/>
    <text x="340" y="120" fill="#FFC83B" font-size="12" text-anchor="middle">Lease Expires</text>
    
    <!-- T4 -->
    <circle cx="460" cy="150" r="6" fill="#00AAFF"/>
    <text x="460" y="120" fill="#00AAFF" font-size="12" font-weight="bold" text-anchor="middle">B gets Lock</text>
    <text x="460" y="180" fill="#00AAFF" font-size="12" text-anchor="middle">Token=101</text>

    <!-- T5 -->
    <circle cx="580" cy="150" r="6" fill="#00AAFF"/>
    <text x="580" y="120" fill="#00AAFF" font-size="12" text-anchor="middle">B Writes DB</text>
    <text x="580" y="180" fill="#00AAFF" font-size="12" font-weight="bold" text-anchor="middle">Accepted</text>

    <!-- T6 -->
    <circle cx="700" cy="150" r="6" fill="#FFFFFF"/>
    <text x="700" y="120" fill="#FFFFFF" font-size="12" text-anchor="middle">A Resumes</text>

    <!-- T7 -->
    <circle cx="820" cy="150" r="8" fill="#FF4444" stroke="#FFFFFF" stroke-width="2"/>
    <text x="820" y="120" fill="#FF4444" font-size="12" font-weight="bold" text-anchor="middle">A Writes DB</text>
    <text x="820" y="180" fill="#FF4444" font-size="12" font-weight="bold" text-anchor="middle">REJECTED!</text>
    <text x="820" y="200" fill="#888888" font-size="10" text-anchor="middle">100 &lt; 101</text>

    <!-- Success highlight -->
    <rect x="760" y="220" width="120" height="30" fill="#2A2A2A" stroke="#00AAFF" stroke-width="1" rx="4"/>
    <text x="820" y="240" fill="#00AAFF" font-size="12" font-weight="bold" text-anchor="middle">System is Safe</text>
</svg>
