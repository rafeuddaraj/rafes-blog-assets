<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Opaque Cursor Architecture</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC83B"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="50" y="80" width="150" height="80" fill="#222" stroke="#888" rx="8"/>
  <text x="125" y="115" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">Client</text>
  <text x="125" y="140" fill="#888" font-family="monospace" font-size="12" text-anchor="middle">?cursor=eyJjcm...</text>

  <!-- API Server -->
  <rect x="325" y="80" width="150" height="80" fill="#222" stroke="#FFC83B" rx="8"/>
  <text x="400" y="115" fill="#FFC83B" font-family="sans-serif" font-size="16" text-anchor="middle">API Server</text>
  <text x="400" y="140" fill="#FFF" font-family="monospace" font-size="12" text-anchor="middle">Decode Base64</text>

  <!-- Database -->
  <rect x="600" y="80" width="150" height="80" fill="#222" stroke="#888" rx="8"/>
  <text x="675" y="115" fill="#FFF" font-family="sans-serif" font-size="16" text-anchor="middle">Database</text>
  <text x="675" y="140" fill="#888" font-family="monospace" font-size="12" text-anchor="middle">(date, id) &lt; (X,Y)</text>

  <!-- Arrows -->
  <line x1="200" y1="120" x2="315" y2="120" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="120" x2="590" y2="120" stroke="#FFC83B" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="257" y="105" fill="#FFC83B" font-family="sans-serif" font-size="12" text-anchor="middle">Token</text>
  <text x="532" y="105" fill="#FFC83B" font-family="sans-serif" font-size="12" text-anchor="middle">State Query</text>
</svg>
