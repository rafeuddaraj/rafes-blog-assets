<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d"><title id="t">Harness and model are two separate decisions</title><desc id="d">A harness is the tool you work in. The model is the engine inside it. Each harness exposes its own controls for model, effort and planning.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFC83B"/></marker></defs><rect width="1200" height="750" fill="#0F0F0F"/><text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Harness and model are two decisions, not one</text><rect x="40.0" y="70.0" width="56.0" height="4.0" rx="2" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="40.0" y="102.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#888888" text-anchor="start">The harness is where you work. The model is the engine. Both can change, and each has its own dials.</text><text x="40.0" y="126.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="start">HARNESS: the tool you work in</text><rect x="40.0" y="140.0" width="346.0" height="300.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="64.0" y="182.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Claude Code</text><rect x="64.0" y="194.0" width="40.0" height="3.0" rx="1.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="70.0" cy="223.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="86.0" y="228.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">/model and aliases (opus, sonnet, haiku)</text><circle cx="70.0" cy="265.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="86.0" y="270.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">opusplan: Opus plans, Sonnet executes</text><circle cx="70.0" cy="307.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="86.0" y="312.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">/effort: low to max</text><circle cx="70.0" cy="349.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="86.0" y="354.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">/advisor: stronger model on hard turns</text><circle cx="70.0" cy="391.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="86.0" y="396.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Plan mode: read-only exploration</text><rect x="427.0" y="140.0" width="346.0" height="300.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="451.0" y="182.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Codex</text><rect x="451.0" y="194.0" width="40.0" height="3.0" rx="1.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="457.0" cy="223.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="473.0" y="228.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">config.toml with named profiles</text><circle cx="457.0" cy="265.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="473.0" y="270.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">model_reasoning_effort</text><circle cx="457.0" cy="307.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="473.0" y="312.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">plan_mode_reasoning_effort</text><circle cx="457.0" cy="349.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="473.0" y="354.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">/model to switch mid-session</text><circle cx="457.0" cy="391.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="473.0" y="396.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">AGENTS.md read at start</text><rect x="814.0" y="140.0" width="346.0" height="300.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="838.0" y="182.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Antigravity</text><rect x="838.0" y="194.0" width="40.0" height="3.0" rx="1.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><circle cx="844.0" cy="223.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="860.0" y="228.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Model dropdown in Agent Manager</text><circle cx="844.0" cy="265.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="860.0" y="270.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Planning mode or Fast mode</text><circle cx="844.0" cy="307.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="860.0" y="312.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Artifacts: plans, task lists, walkthroughs</text><circle cx="844.0" cy="349.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="860.0" y="354.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Agent Manager runs agents in parallel</text><circle cx="844.0" cy="391.0" r="3.5" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="860.0" y="396.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Comments on plan artifacts</text><line x1="213.0" y1="442.0" x2="213.0" y2="506.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="600.0" y1="442.0" x2="600.0" y2="506.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="987.0" y1="442.0" x2="987.0" y2="506.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><text x="40.0" y="498.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFC83B" text-anchor="start">MODEL: the engine inside</text><rect x="40.0" y="514.0" width="346.0" height="96.0" rx="14" fill="#1E1E1E" stroke="#FFC83B" stroke-width="1.4"/><text x="64.0" y="552.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFC83B" text-anchor="start">Claude family</text><text x="64.0" y="580.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Haiku 5.5, Sonnet 5.5, Opus 5.5, Fable</text><text x="64.0" y="599.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">5.1</text><rect x="427.0" y="514.0" width="346.0" height="96.0" rx="14" fill="#1E1E1E" stroke="#FFC83B" stroke-width="1.4"/><text x="451.0" y="552.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFC83B" text-anchor="start">OpenAI GPT-6 family</text><text x="451.0" y="580.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Luna, Terra, Sol, Astra (names change</text><text x="451.0" y="599.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">often)</text><rect x="814.0" y="514.0" width="346.0" height="96.0" rx="14" fill="#1E1E1E" stroke="#FFC83B" stroke-width="1.4"/><text x="838.0" y="552.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFC83B" text-anchor="start">Google Gemini 4 family</text><text x="838.0" y="580.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Argon (first of the family), thinking</text><text x="838.0" y="599.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">levels</text><rect x="40.0" y="640.0" width="1120.0" height="52.0" rx="12" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="6 5"/><text x="600.0" y="672.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Model quality = Tier x Effort x Context you give it x How you verify. Change one, and the result changes.</text><text x="40.0" y="726.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Controls listed come from each vendor's documentation as read on 2026-11-07. Names and flags change, check the docs before you rely on them.</text></svg>
