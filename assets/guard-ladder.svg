<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="820" height="410" role="img" aria-label="Six level guard ladder showing what each level closes and how it breaks">
<style>
.t{fill:#FFFFFF;font:13px Arial,Helvetica,sans-serif}
.s{fill:#FFFFFF;font:12px Arial,Helvetica,sans-serif}
.g{fill:#888888;font:bold 12px Arial,Helvetica,sans-serif}
.y{fill:#FFC83B;font:bold 13px Arial,Helvetica,sans-serif}
.b{fill:#0F0F0F;stroke:#FFC83B;stroke-width:1.5}
.n{fill:#0F0F0F;stroke:#888888;stroke-width:1.5}
</style>
<rect width="820" height="410" fill="#0F0F0F"/>
<text x="20" y="30" class="g">LEVEL</text>
<text x="228" y="30" class="g">WHAT IT CLOSES</text>
<text x="470" y="30" class="g">HOW IT BREAKS</text>
<rect x="20" y="44" width="190" height="44" rx="6" class="n"/><text x="32" y="71" class="t">L0 Naive resume</text>
<text x="228" y="71" class="s">Nothing</text>
<text x="470" y="71" class="s">Any crash after the effect repeats it</text>
<rect x="20" y="100" width="190" height="44" rx="6" class="n"/><text x="32" y="127" class="t">L1 Hash of args as key</text>
<text x="228" y="127" class="s">W3 and W4, if args are identical</text>
<text x="470" y="127" class="s">LLM rewords args, hash changes</text>
<rect x="20" y="156" width="190" height="44" rx="6" class="b"/><text x="32" y="183" class="t">L2 Stable key from state</text>
<text x="228" y="183" class="s">W3 and W4 with a key aware provider</text>
<text x="470" y="183" class="s">Provider ignores the key</text>
<rect x="20" y="212" width="190" height="44" rx="6" class="b"/><text x="32" y="239" class="t">L3 Durable execution</text>
<text x="228" y="239" class="s">Durable intent, replay, retries</text>
<text x="470" y="239" class="s">Activities still run at least once</text>
<rect x="20" y="268" width="190" height="44" rx="6" class="b"/><text x="32" y="295" class="t">L4 Atomic commit</text>
<text x="228" y="295" class="s">The W3 gap, for your own DB</text>
<text x="470" y="295" class="s">Does not reach external APIs</text>
<rect x="20" y="324" width="190" height="44" rx="6" class="b"/><text x="32" y="351" class="y">L5 UNKNOWN and reconcile</text>
<text x="228" y="351" class="s">Ambiguity with external APIs</text>
<text x="470" y="351" class="s">No lookup API needs a human gate</text>
<text x="410" y="396" text-anchor="middle" class="g">Each level starts where the previous one breaks</text>
</svg>
