<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  
  <rect x="50" y="50" width="200" height="250" rx="8" fill="#1E1E1E" stroke="#888888" stroke-width="2"/>
  <text x="150" y="90" fill="#FFC83B" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">At-Most-Once</text>
  <text x="150" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Delivery: 0 or 1</text>
  <text x="150" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Retry: None</text>
  <text x="150" y="190" fill="#FF5555" font-family="sans-serif" font-size="14" text-anchor="middle">Data Loss: High</text>
  <text x="150" y="220" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Duplicate: None</text>

  <rect x="300" y="50" width="200" height="250" rx="8" fill="#1E1E1E" stroke="#888888" stroke-width="2"/>
  <text x="400" y="90" fill="#FFC83B" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">At-Least-Once</text>
  <text x="400" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Delivery: 1 or More</text>
  <text x="400" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Retry: On Timeout</text>
  <text x="400" y="190" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Data Loss: None</text>
  <text x="400" y="220" fill="#FF5555" font-family="sans-serif" font-size="14" text-anchor="middle">Duplicate: Possible</text>

  <rect x="550" y="50" width="200" height="250" rx="8" fill="#1E1E1E" stroke="#FFC83B" stroke-width="3"/>
  <text x="650" y="90" fill="#FFC83B" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Exactly-Once</text>
  <text x="650" y="130" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Delivery: Effectively 1</text>
  <text x="650" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">System: Complex</text>
  <text x="650" y="190" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Data Loss: None</text>
  <text x="650" y="220" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Duplicate State: Blocked</text>
</svg>
