<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <rect x="50" y="50" width="700" height="300" rx="8" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
  <text x="400" y="85" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Production Observability Dashboard</text>
  
  <rect x="80" y="120" width="200" height="80" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="1"/>
  <text x="180" y="150" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Active / Idle / Max</text>
  <text x="180" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">8 / 2 / 10</text>
  
  <rect x="300" y="120" width="200" height="80" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="1"/>
  <text x="400" y="150" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Waiting Requests</text>
  <text x="400" y="180" fill="#FF3B3B" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">145</text>

  <rect x="520" y="120" width="200" height="80" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="1"/>
  <text x="620" y="150" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Conn Acquire Latency</text>
  <text x="620" y="180" fill="#FF3B3B" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">850 ms</text>

  <rect x="80" y="220" width="310" height="80" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="235" y="250" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">DB Query Latency (Avg)</text>
  <text x="235" y="280" fill="#00FF00" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">35 ms</text>

  <rect x="410" y="220" width="310" height="80" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="565" y="250" fill="#888888" font-family="sans-serif" font-size="12" text-anchor="middle">Pool Timeout Errors / sec</text>
  <text x="565" y="280" fill="#FF3B3B" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">12</text>
</svg>
