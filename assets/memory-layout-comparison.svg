<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0F0F0F; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Title -->
  <text x="400" y="35" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">MEMORY LAYOUT: ARRAY vs LINKED LIST</text>

  <!-- Section 1: Array -->
  <text x="50" y="80" fill="#FFC83B" font-size="18" font-weight="bold">1. Array (Contiguous Memory Allocation)</text>
  <text x="50" y="100" fill="#888888" font-size="13">Elements are stored in adjacent memory blocks. Fast O(1) index lookup by pointer arithmetic.</text>

  <!-- Array Blocks -->
  <g transform="translate(50, 130)">
    <!-- Block 0 -->
    <rect x="0" y="0" width="100" height="60" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2" rx="4" />
    <text x="50" y="35" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Data[0]</text>
    <text x="50" y="80" fill="#888888" font-size="12" text-anchor="middle">0x100</text>
    
    <!-- Block 1 -->
    <rect x="100" y="0" width="100" height="60" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2" rx="4" />
    <text x="150" y="35" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Data[1]</text>
    <text x="150" y="80" fill="#888888" font-size="12" text-anchor="middle">0x104</text>

    <!-- Block 2 -->
    <rect x="200" y="0" width="100" height="60" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2" rx="4" />
    <text x="250" y="35" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Data[2]</text>
    <text x="250" y="80" fill="#888888" font-size="12" text-anchor="middle">0x108</text>

    <!-- Block 3 -->
    <rect x="300" y="0" width="100" height="60" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2" rx="4" />
    <text x="350" y="35" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Data[3]</text>
    <text x="350" y="80" fill="#888888" font-size="12" text-anchor="middle">0x10C</text>

    <!-- Block 4 -->
    <rect x="400" y="0" width="100" height="60" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2" rx="4" />
    <text x="450" y="35" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Data[4]</text>
    <text x="450" y="80" fill="#888888" font-size="12" text-anchor="middle">0x110</text>
  </g>

  <!-- Divider Line -->
  <line x1="50" y1="240" x2="750" y2="240" stroke="#222222" stroke-width="2" />

  <!-- Section 2: Linked List -->
  <text x="50" y="275" fill="#00E5FF" font-size="18" font-weight="bold">2. Linked List (Scattered Memory Nodes)</text>
  <text x="50" y="295" fill="#888888" font-size="13">Nodes are scattered across RAM. Connected via pointer addresses. Fast O(1) insertion/deletion.</text>

  <!-- Linked List Nodes -->
  <g transform="translate(50, 330)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="80" height="50" fill="#1A1A1A" stroke="#00E5FF" stroke-width="2" rx="4" />
    <text x="40" y="30" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Node A</text>
    <rect x="80" y="0" width="40" height="50" fill="#2A2A2A" stroke="#00E5FF" stroke-width="2" rx="4" />
    <text x="100" y="30" fill="#FFC83B" font-size="11" text-anchor="middle">0x840</text>
    <text x="60" y="70" fill="#888888" font-size="12" text-anchor="middle">Addr: 0x310</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 120 25 Q 150 5, 175 25" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Node 2 -->
    <rect x="180" y="0" width="80" height="50" fill="#1A1A1A" stroke="#00E5FF" stroke-width="2" rx="4" />
    <text x="220" y="30" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Node B</text>
    <rect x="260" y="0" width="40" height="50" fill="#2A2A2A" stroke="#00E5FF" stroke-width="2" rx="4" />
    <text x="280" y="30" fill="#FFC83B" font-size="11" text-anchor="middle">0x120</text>
    <text x="240" y="70" fill="#888888" font-size="12" text-anchor="middle">Addr: 0x840</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 300 25 Q 330 45, 355 25" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Node 3 -->
    <rect x="360" y="0" width="80" height="50" fill="#1A1A1A" stroke="#00E5FF" stroke-width="2" rx="4" />
    <text x="400" y="30" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">Node C</text>
    <rect x="440" y="0" width="40" height="50" fill="#2A2A2A" stroke="#00E5FF" stroke-width="2" rx="4" />
    <text x="460" y="30" fill="#FF3B30" font-size="11" font-weight="bold" text-anchor="middle">NULL</text>
    <text x="420" y="70" fill="#888888" font-size="12" text-anchor="middle">Addr: 0x120</text>
  </g>

  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
    </marker>
  </defs>
</svg>