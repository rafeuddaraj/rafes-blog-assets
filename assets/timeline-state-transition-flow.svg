<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%" style="background-color: #0F0F0F; font-family: 'Courier New', Courier, monospace;">
  <!-- Title -->
  <text x="400" y="30" fill="#FFC83B" font-size="18" font-weight="bold" text-anchor="middle">TIMELINE STATE TRANSITION AFTER DELETE ACTION</text>
  <line x1="50" y1="45" x2="750" y2="45" stroke="#333333" stroke-width="2"/>

  <!-- Timeline Central Bar -->
  <line x1="50" y1="180" x2="750" y2="180" stroke="#555555" stroke-width="4"/>

  <!-- Step 1: Old Message 1 -->
  <circle cx="150" cy="180" r="8" fill="#888888"/>
  <rect x="80" y="90" width="140" height="60" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="1"/>
  <text x="150" y="115" fill="#FFFFFF" font-size="11" text-anchor="middle">Msg 1: "Hi there!"</text>
  <text x="150" y="135" fill="#888888" font-size="10" text-anchor="middle">10:00 AM</text>
  <line x1="150" y1="150" x2="150" y2="180" stroke="#888888" stroke-width="1.5"/>

  <!-- Step 2: Old Message 2 -->
  <circle cx="300" cy="180" r="8" fill="#888888"/>
  <rect x="230" y="90" width="140" height="60" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="1"/>
  <text x="300" y="115" fill="#FFFFFF" font-size="11" text-anchor="middle">Msg 2: "How are you?"</text>
  <text x="300" y="135" fill="#888888" font-size="10" text-anchor="middle">10:05 AM</text>
  <line x1="300" y1="150" x2="300" y2="180" stroke="#888888" stroke-width="1.5"/>

  <!-- Step 3: Delete Action (The Wall) -->
  <line x1="450" y1="70" x2="450" y2="290" stroke="#FF5555" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="380" y="220" width="140" height="50" rx="4" fill="#FF5555"/>
  <text x="450" y="242" fill="#0F0F0F" font-size="11" font-weight="bold" text-anchor="middle">DELETE ACTION</text>
  <text x="450" y="258" fill="#0F0F0F" font-size="10" text-anchor="middle">cleared_at = 10:10 AM</text>

  <!-- Step 4: New Message -->
  <circle cx="630" cy="180" r="8" fill="#55FF55"/>
  <rect x="560" y="90" width="140" height="60" rx="4" fill="#1A1A1A" stroke="#55FF55" stroke-width="1.5"/>
  <text x="630" y="115" fill="#FFFFFF" font-size="11" text-anchor="middle">Msg 3: "I am good!"</text>
  <text x="630" y="135" fill="#55FF55" font-size="10" text-anchor="middle">10:15 AM (Active)</text>
  <line x1="630" y1="150" x2="630" y2="180" stroke="#55FF55" stroke-width="1.5"/>

  <!-- State Annotations Bottom -->
  <text x="225" y="315" fill="#888888" font-size="12" font-style="italic" text-anchor="middle">[Invisible to User Query Boundary]</text>
  <text x="630" y="315" fill="#55FF55" font-size="12" font-weight="bold" text-anchor="middle">[Visible in UI Inbox]</text>
</svg>