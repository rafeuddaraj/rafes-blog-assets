<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Total Database Related Latency</text>
  
  <rect x="50" y="80" width="500" height="50" fill="#2A2A2A" stroke="#FFC83B" stroke-width="2"/>
  <text x="300" y="110" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Connection Wait Time (800ms)</text>
  
  <rect x="550" y="80" width="100" height="50" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
  <text x="600" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Exec (30ms)</text>
  
  <rect x="650" y="80" width="100" height="50" fill="#2A2A2A" stroke="#888888" stroke-width="1"/>
  <text x="700" y="110" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Overhead</text>

  <path d="M 50 160 L 750 160" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-r)"/>
  <path d="M 50 150 L 50 170" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 750 150 L 750 170" stroke="#FFFFFF" stroke-width="2"/>
  <text x="400" y="190" fill="#FFFFFF" font-family="sans-serif" font-size="16" text-anchor="middle">Total API Request Latency perceived by User: 850ms+</text>
  <text x="400" y="215" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Database is NOT slow. Resource Starvation is the issue.</text>
  
  <defs>
    <marker id="a-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/></marker>
  </defs>
</svg>
