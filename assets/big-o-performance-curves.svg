<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #0F0F0F; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Title -->
  <text x="400" y="40" fill="#FFFFFF" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="1">BIG-O PERFORMANCE CURVES</text>
  <text x="400" y="65" fill="#888888" font-size="14" text-anchor="middle">Time Complexity Scaling with Input Size (n)</text>

  <!-- Axes -->
  <line x1="100" y1="420" x2="720" y2="420" stroke="#888888" stroke-width="2" />
  <line x1="100" y1="420" x2="100" y2="100" stroke="#888888" stroke-width="2" />
  
  <!-- Axis Arrows -->
  <polygon points="720,415 730,420 720,425" fill="#888888" />
  <polygon points="95,100 100,90 105,100" fill="#888888" />

  <!-- Axis Labels -->
  <text x="410" y="460" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">Input Size (n)</text>
  <text x="40" y="260" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90 40 260)">Time / Operations</text>

  <!-- Grid Lines (Horizontal) -->
  <line x1="100" y1="340" x2="710" y2="340" stroke="#222222" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="100" y1="260" x2="710" y2="260" stroke="#222222" stroke-width="1" stroke-dasharray="5,5" />
  <line x1="100" y1="180" x2="710" y2="180" stroke="#222222" stroke-width="1" stroke-dasharray="5,5" />

  <!-- O(1) Constant - Tech Yellow -->
  <line x1="100" y1="380" x2="700" y2="380" stroke="#FFC83B" stroke-width="4" />
  <text x="630" y="370" fill="#FFC83B" font-size="16" font-weight="bold">O(1) - Constant</text>

  <!-- O(log n) Logarithmic - Soft Grey -->
  <path d="M 100 420 Q 250 360, 700 330" fill="none" stroke="#00E5FF" stroke-width="4" />
  <text x="580" y="320" fill="#00E5FF" font-size="16" font-weight="bold">O(log n) - Logarithmic</text>

  <!-- O(n) Linear - Clean White -->
  <line x1="100" y1="420" x2="600" y2="120" stroke="#FFFFFF" stroke-width="4" />
  <text x="510" y="140" fill="#FFFFFF" font-size="16" font-weight="bold">O(n) - Linear</text>

  <!-- O(n^2) Quadratic - Red/Orange Alert -->
  <path d="M 100 420 Q 300 400, 380 110" fill="none" stroke="#FF3B30" stroke-width="4" />
  <text x="390" y="130" fill="#FF3B30" font-size="16" font-weight="bold">O(n²) - Quadratic</text>

  <!-- Danger Zone Background Accent -->
  <polygon points="100,100 365,100 380,110 100,420" fill="#FF3B30" opacity="0.05" />
  <text x="200" y="150" fill="#FF3B30" font-size="14" font-weight="bold" opacity="0.6">DANGER ZONE (Server Freeze)</text>
</svg>