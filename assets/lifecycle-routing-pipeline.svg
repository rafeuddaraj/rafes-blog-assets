<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d"><title id="t">Routing across the project lifecycle</title><desc id="d">Eight project phases from brainstorm to documentation, each with a recommended model tier and three human gates.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FFC83B"/></marker></defs><rect width="1200" height="650" fill="#0F0F0F"/><text x="40.0" y="56.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Route by phase, with a human at three gates</text><rect x="40.0" y="70.0" width="56.0" height="4.0" rx="2" fill="#FFC83B" stroke="none" stroke-width="1.5"/><text x="40.0" y="102.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#888888" text-anchor="start">A starting point for each phase. Your Routing Card overrides it once you have measured your own tasks.</text><rect x="40.0" y="150.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="62.0" y="190.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">1  Brainstorm</text><rect x="62.0" y="208.0" width="63.2" height="23.0" rx="6" fill="#FFC83B" stroke="#FFC83B" stroke-width="1.5"/><text x="93.6" y="222.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">STRONG</text><text x="62.0" y="262.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Wrong choices here cost</text><text x="62.0" y="281.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">the most</text><rect x="333.0" y="150.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="355.0" y="190.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">2  PRD</text><rect x="355.0" y="208.0" width="78.3" height="23.0" rx="6" fill="none" stroke="#FFC83B" stroke-width="1.6"/><text x="394.2" y="222.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="middle">BALANCED</text><text x="355.0" y="262.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Make it ask questions</text><text x="355.0" y="281.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">first</text><rect x="626.0" y="150.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="648.0" y="190.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">3  Architecture</text><rect x="648.0" y="208.0" width="63.2" height="23.0" rx="6" fill="#FFC83B" stroke="#FFC83B" stroke-width="1.5"/><text x="679.6" y="222.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">STRONG</text><text x="648.0" y="262.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Write an ADR for each big</text><text x="648.0" y="281.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">choice</text><rect x="919.0" y="150.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="941.0" y="190.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">4  Spec and tasks</text><rect x="941.0" y="208.0" width="78.3" height="23.0" rx="6" fill="none" stroke="#FFC83B" stroke-width="1.6"/><text x="980.2" y="222.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="middle">BALANCED</text><text x="941.0" y="262.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Acceptance criteria per</text><text x="941.0" y="281.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">task</text><rect x="40.0" y="390.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="62.0" y="430.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">5  Implement</text><rect x="62.0" y="448.0" width="78.3" height="23.0" rx="6" fill="none" stroke="#FFC83B" stroke-width="1.6"/><text x="101.2" y="462.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFC83B" text-anchor="middle">BALANCED</text><text x="62.0" y="502.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Fast tier for boilerplate</text><rect x="333.0" y="390.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#FFC83B" stroke-width="1.8"/><text x="355.0" y="430.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">6  Review</text><rect x="355.0" y="448.0" width="63.2" height="23.0" rx="6" fill="#FFC83B" stroke="#FFC83B" stroke-width="1.5"/><text x="386.6" y="462.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">STRONG</text><text x="355.0" y="502.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Use a different model or</text><text x="355.0" y="521.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">fresh context</text><rect x="626.0" y="390.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="648.0" y="430.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">7  Debug</text><rect x="648.0" y="448.0" width="48.2" height="23.0" rx="6" fill="none" stroke="#888888" stroke-width="1.6"/><text x="672.1" y="462.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#888888" text-anchor="middle">FAST</text><text x="648.0" y="502.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Triage logs first, then</text><text x="648.0" y="521.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">escalate</text><rect x="919.0" y="390.0" width="240.0" height="150.0" rx="14" fill="#171717" stroke="#888888" stroke-width="1.2"/><text x="941.0" y="430.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">8  Docs</text><rect x="941.0" y="448.0" width="48.2" height="23.0" rx="6" fill="none" stroke="#888888" stroke-width="1.6"/><text x="965.1" y="462.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#888888" text-anchor="middle">FAST</text><text x="941.0" y="502.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">Changelog, README,</text><text x="941.0" y="521.6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#888888" text-anchor="start">comments</text><line x1="280.0" y1="225.0" x2="333.0" y2="225.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="573.0" y1="225.0" x2="584.5" y2="225.0" stroke="#FFC83B" stroke-width="2"/><line x1="614.5" y1="225.0" x2="626.0" y2="225.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="866.0" y1="225.0" x2="877.5" y2="225.0" stroke="#FFC83B" stroke-width="2"/><line x1="907.5" y1="225.0" x2="919.0" y2="225.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="280.0" y1="465.0" x2="333.0" y2="465.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="573.0" y1="465.0" x2="584.5" y2="465.0" stroke="#FFC83B" stroke-width="2"/><line x1="614.5" y1="465.0" x2="626.0" y2="465.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><line x1="866.0" y1="465.0" x2="919.0" y2="465.0" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><path d="M1039.0 300.0 L1039.0 340.0 L160.0 340.0 L160.0 390.0" fill="none" stroke="#FFC83B" stroke-width="2" marker-end="url(#arr)"/><path d="M599.5 211.0 L613.5 225.0 L599.5 239.0 L585.5 225.0 Z" fill="#FFC83B" stroke="#FFC83B" stroke-width="2"/><text x="599.5" y="201.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFC83B" text-anchor="middle">SCOPE</text><path d="M892.5 211.0 L906.5 225.0 L892.5 239.0 L878.5 225.0 Z" fill="#FFC83B" stroke="#FFC83B" stroke-width="2"/><text x="892.5" y="201.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFC83B" text-anchor="middle">ADR</text><path d="M599.5 451.0 L613.5 465.0 L599.5 479.0 L585.5 465.0 Z" fill="#FFC83B" stroke="#FFC83B" stroke-width="2"/><text x="599.5" y="441.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFC83B" text-anchor="middle">RELEASE</text><path d="M47 588 L55 596 L47 604 L39 596 Z" fill="#FFC83B" stroke="#FFC83B" stroke-width="1.5"/><text x="66.0" y="601.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Human gate: a person decides before the next phase starts</text><text x="40.0" y="626.0" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#888888" text-anchor="start">Tier names are generic on purpose. The Routing Card maps them to the real models you use this month.</text></svg>
