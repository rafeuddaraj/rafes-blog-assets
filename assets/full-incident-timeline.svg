<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Cascading Failure Timeline</text>
  
  <path d="M 100 80 L 100 350" stroke="#888888" stroke-width="4"/>
  
  <circle cx="100" cy="100" r="8" fill="#FFC83B"/>
  <text x="130" y="105" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">1. Traffic Spike Hits</text>

  <circle cx="100" cy="140" r="8" fill="#FFC83B"/>
  <text x="130" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">2. App Autoscales (New Instances created)</text>

  <circle cx="100" cy="180" r="8" fill="#FFC83B"/>
  <text x="130" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">3. Connection Explosion on Database</text>

  <circle cx="100" cy="220" r="8" fill="#FFC83B"/>
  <text x="130" y="225" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="start">4. DB Contention -> Queries slow down</text>

  <circle cx="100" cy="260" r="8" fill="#FF3B3B"/>
  <text x="130" y="265" fill="#FF3B3B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start">5. Pool Queue Fills up &amp; Wait Time skyrockets</text>

  <circle cx="100" cy="300" r="8" fill="#FF3B3B"/>
  <text x="130" y="305" fill="#FF3B3B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start">6. API Timeouts begin (Clients retry aggressively)</text>

  <circle cx="100" cy="340" r="8" fill="#FF3B3B"/>
  <text x="130" y="345" fill="#FF3B3B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start">7. Complete System Outage</text>
</svg>
