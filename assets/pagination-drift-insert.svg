<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <text x="400" y="40" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Pagination Drift (Concurrent Insert)</text>

  <!-- Initial State -->
  <text x="200" y="80" fill="#888" font-family="sans-serif" font-size="16" text-anchor="middle">State 1: Fetch Page 1</text>
  <rect x="150" y="100" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="200" y="120" fill="#FFF" font-family="monospace">Post A</text>
  <rect x="150" y="130" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="200" y="150" fill="#FFF" font-family="monospace">Post B</text>
  
  <path d="M 120 100 L 120 160 L 140 160" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <text x="60" y="135" fill="#FFC83B" font-family="sans-serif" font-size="12">OFFSET 0</text>

  <!-- Intermediate State -->
  <path d="M 320 150 L 400 150" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="140" fill="#FF4444" font-family="sans-serif" font-size="12" text-anchor="middle">Insert NEW</text>

  <!-- Final State -->
  <text x="600" y="80" fill="#888" font-family="sans-serif" font-size="16" text-anchor="middle">State 2: Fetch Page 2 (OFFSET 2)</text>
  <rect x="550" y="100" width="100" height="30" fill="#440000" stroke="#FF4444"/>
  <text x="600" y="120" fill="#FF4444" font-family="monospace">Post NEW</text>
  
  <rect x="550" y="130" width="100" height="30" fill="#222" stroke="#444"/>
  <text x="600" y="150" fill="#FFF" font-family="monospace">Post A</text>
  
  <rect x="550" y="160" width="100" height="30" fill="#2A2A00" stroke="#FFC83B"/>
  <text x="600" y="180" fill="#FFC83B" font-family="monospace">Post B</text>
  <rect x="550" y="190" width="100" height="30" fill="#2A2A00" stroke="#FFC83B"/>
  <text x="600" y="210" fill="#FFC83B" font-family="monospace">Post C</text>

  <path d="M 520 160 L 520 220 L 540 220" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <text x="460" y="195" fill="#FFC83B" font-family="sans-serif" font-size="12">OFFSET 2</text>
  
  <text x="710" y="180" fill="#FF4444" font-family="sans-serif" font-size="14" font-weight="bold">Duplicate!</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
</svg>
