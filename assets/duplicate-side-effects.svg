  <text x="110" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Duplicate Msg</text>
  
  <path d="M 180 180 L 300 180" stroke="#FF5555" stroke-width="2" fill="none"/>
