  <text x="100" y="185" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Request</text>
  <text x="100" y="205" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">ID: A-123</text>

  <rect x="250" y="130" width="140" height="100" rx="8" fill="#1E1E1E" stroke="#888888" stroke-width="2"/>
  <text x="320" y="160" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Idempotency</text>
  <text x="320" y="180" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Store Check</text>

  <path d="M 160 180 L 240 180" stroke="#FFC83B" stroke-width="2" fill="none"/>
  <polygon points="245,180 235,175 235,185" fill="#FFC83B"/>

  <!-- Path: Key exists -->
  <path d="M 390 150 L 500 100" stroke="#888888" stroke-width="2" fill="none"/>
