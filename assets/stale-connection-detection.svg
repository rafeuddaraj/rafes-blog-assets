<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <g transform="translate(150, 20)">
    <rect x="0" y="0" width="500" height="50" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="250" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="16" text-anchor="middle">App requests Connection</text>
    
    <path d="M 250 50 L 250 90" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <rect x="0" y="90" width="500" height="50" rx="4" fill="#1A1A1A" stroke="#FFC83B" stroke-width="2"/>
    <text x="250" y="120" fill="#FFC83B" font-family="sans-serif" font-size="16" text-anchor="middle">Pool picks Idle Conn &amp; Runs Health Check (e.g. SELECT 1)</text>
    
    <path d="M 250 140 L 250 180" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <rect x="0" y="180" width="220" height="50" rx="4" fill="#2A2A2A" stroke="#00FF00" stroke-width="2"/>
    <text x="110" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Valid -> Hand to App</text>
    
    <rect x="280" y="180" width="220" height="50" rx="4" fill="#2A2A2A" stroke="#FF3B3B" stroke-width="2"/>
    <text x="390" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Invalid -> Discard</text>
    
    <path d="M 390 230 L 390 270" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <rect x="280" y="270" width="220" height="50" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="390" y="300" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Create New Connection</text>
  </g>
</svg>
