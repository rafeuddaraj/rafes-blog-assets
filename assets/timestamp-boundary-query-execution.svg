<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0F0F0F; font-family: 'Courier New', Courier, monospace;">
  <!-- Title -->
  <text x="400" y="30" fill="#FFC83B" font-size="18" font-weight="bold" text-anchor="middle">B-TREE INDEX TRAVERSAL & TIMESTAMP BOUNDARY BYPASS</text>
  <line x1="50" y1="45" x2="750" y2="45" stroke="#333333" stroke-width="2"/>

  <!-- Root Node -->
  <rect x="300" y="60" width="200" height="40" rx="5" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="400" y="85" fill="#FFFFFF" font-size="13" text-anchor="middle">Index: conv_12345</text>

  <!-- Lines from Root -->
  <line x1="350" y1="100" x2="200" y2="150" stroke="#888888" stroke-width="1.5"/>
  <line x1="450" y1="100" x2="600" y2="150" stroke="#FFC83B" stroke-width="1.5"/>

  <!-- Left Child: Bypassed Node -->
  <rect x="100" y="150" width="200" height="50" rx="5" fill="#1F1515" stroke="#FF5555" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="200" y="170" fill="#FF5555" font-size="12" text-anchor="middle">Time: 08:00 to 09:59</text>
  <text x="200" y="188" fill="#888888" font-size="11" text-anchor="middle">[SKIPPED IN MEMORY]</text>

  <!-- Right Child: Traversed Node -->
  <rect x="500" y="150" width="200" height="50" rx="5" fill="#151F15" stroke="#55FF55" stroke-width="1.5"/>
  <text x="600" y="170" fill="#55FF55" font-size="12" text-anchor="middle">Time: 10:00 to 12:00</text>
  <text x="600" y="188" fill="#FFFFFF" font-size="11" text-anchor="middle">[TRAVERSED]</text>

  <!-- The Invisible Wall (Boundary Line) -->
  <line x1="400" y1="120" x2="400" y2="380" stroke="#FFC83B" stroke-width="2.5" stroke-dasharray="6,6"/>
  <rect x="310" y="240" width="180" height="30" rx="3" fill="#FFC83B"/>
  <text x="400" y="260" fill="#0F0F0F" font-size="11" font-weight="bold" text-anchor="middle">cleared_at = 10:00:00</text>

  <!-- Message Nodes Below Left (Bypassed) -->
  <rect x="60" y="290" width="130" height="60" rx="4" fill="#1A1A1A" stroke="#444444" stroke-width="1"/>
  <text x="125" y="315" fill="#666666" font-size="11" text-anchor="middle">ID: msg_01</text>
  <text x="125" y="335" fill="#666666" font-size="10" text-anchor="middle">Time: 08:30 (Old)</text>

  <rect x="210" y="290" width="130" height="60" rx="4" fill="#1A1A1A" stroke="#444444" stroke-width="1"/>
  <text x="275" y="315" fill="#666666" font-size="11" text-anchor="middle">ID: msg_02</text>
  <text x="275" y="335" fill="#666666" font-size="10" text-anchor="middle">Time: 09:45 (Old)</text>

  <!-- Message Nodes Below Right (Returned) -->
  <rect x="460" y="290" width="130" height="60" rx="4" fill="#1A1A1A" stroke="#55FF55" stroke-width="1.5"/>
  <text x="525" y="315" fill="#FFFFFF" font-size="11" text-anchor="middle">ID: msg_03</text>
  <text x="525" y="335" fill="#55FF55" font-size="10" text-anchor="middle">Time: 10:05 (New)</text>

  <rect x="610" y="290" width="130" height="60" rx="4" fill="#1A1A1A" stroke="#55FF55" stroke-width="1.5"/>
  <text x="675" y="315" fill="#FFFFFF" font-size="11" text-anchor="middle">ID: msg_04</text>
  <text x="675" y="335" fill="#55FF55" font-size="10" text-anchor="middle">Time: 10:30 (New)</text>

  <!-- Bottom Explanatory Text -->
  <text x="200" y="410" fill="#FF5555" font-size="12" text-anchor="middle">&lt;-- Hidden from User (Bypassed by Index)</text>
  <text x="600" y="410" fill="#55FF55" font-size="12" text-anchor="middle">Returned to Client UI --&gt;</text>
</svg>