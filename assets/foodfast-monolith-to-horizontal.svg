<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" style="background:#0F0F0F; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #FFFFFF; }
      .subtitle { font-size: 14px; font-weight: 600; fill: #FFC83B; }
      .node-text { font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .desc-text { font-size: 11px; fill: #AAAAAA; }
      .box { fill: #1A1A1A; stroke: #333333; stroke-width: 2; rx: 8; }
      .box-highlight { fill: #1F1A0C; stroke: #FFC83B; stroke-width: 2; rx: 8; }
      .box-db { fill: #141A1F; stroke: #4A90E2; stroke-width: 2; rx: 8; }
      .arrow { fill: none; stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-yellow { fill: none; stroke: #FFC83B; stroke-width: 2; marker-end: url(#arrowhead-yellow); }
      .arrow-blue { fill: none; stroke: #4A90E2; stroke-width: 2; marker-end: url(#arrowhead-blue); }
      .divider { stroke: #2A2A2A; stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666" />
    </marker>
    <marker id="arrowhead-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFC83B" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A90E2" />
    </marker>
  </defs>

  <!-- Left Side: Monolith Architecture -->
  <text x="220" y="40" text-anchor="middle" class="title">FoodFast Monolith (Day-1)</text>
  <text x="220" y="60" text-anchor="middle" class="subtitle">Single Server &amp; DB Contention</text>
  
  <rect x="140" y="100" width="160" height="60" class="box" />
  <text x="220" y="125" text-anchor="middle" class="node-text">Mobile &amp; Web Clients</text>
  <text x="220" y="145" text-anchor="middle" class="desc-text">10,000+ Active Users</text>

  <line x1="220" y1="160" x2="220" y2="220" class="arrow" />

  <rect x="120" y="220" width="200" height="100" class="box-highlight" />
  <text x="220" y="250" text-anchor="middle" class="node-text" fill="#FFC83B">Single Monolith Server</text>
  <text x="220" y="275" text-anchor="middle" class="desc-text">App Logic + Thread Pool</text>
  <text x="220" y="295" text-anchor="middle" class="desc-text" fill="#FF6B6B">100% CPU Bottleneck / OOM</text>

  <line x1="220" y1="320" x2="220" y2="380" class="arrow" />

  <rect x="120" y="380" width="200" height="80" class="box-db" />
  <text x="220" y="415" text-anchor="middle" class="node-text" fill="#4A90E2">Single Relational DB</text>
  <text x="220" y="435" text-anchor="middle" class="desc-text">Disk I/O &amp; Memory Contention</text>

  <!-- Center Divider -->
  <line x1="450" y1="80" x2="450" y2="530" class="divider" />

  <!-- Right Side: Scaled Horizontal Architecture -->
  <text x="720" y="40" text-anchor="middle" class="title">FoodFast Scaled Architecture</text>
  <text x="720" y="60" text-anchor="middle" class="subtitle">Horizontal Scaling &amp; Load Balancing</text>

  <rect x="640" y="90" width="160" height="50" class="box" />
  <text x="720" y="120" text-anchor="middle" class="node-text">1,000,000+ Flash Sale Users</text>

  <line x1="720" y1="140" x2="720" y2="180" class="arrow-yellow" />

  <rect x="620" y="180" width="200" height="50" class="box-highlight" />
  <text x="720" y="210" text-anchor="middle" class="node-text" fill="#FFC83B">Nginx / HAProxy Load Balancer</text>

  <!-- Arrows from Load Balancer to App Servers -->
  <path d="M 720 230 L 550 280" class="arrow" />
  <path d="M 720 230 L 720 280" class="arrow" />
  <path d="M 720 230 L 890 280" class="arrow" />

  <!-- Auto Scaling Group Box -->
  <rect x="470" y="270" width="500" height="100" fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="4 4" rx="10" />
  <text x="490" y="290" class="desc-text">Auto-Scaling Group (Stateless App Cluster)</text>

  <rect x="490" y="300" width="120" height="50" class="box" />
  <text x="550" y="330" text-anchor="middle" class="node-text">App Node 1</text>

  <rect x="660" y="300" width="120" height="50" class="box" />
  <text x="720" y="330" text-anchor="middle" class="node-text">App Node 2</text>

  <rect x="830" y="300" width="120" height="50" class="box" />
  <text x="890" y="330" text-anchor="middle" class="node-text">App Node 3</text>

  <!-- Redis Session & Cache -->
  <rect x="490" y="430" width="140" height="60" fill="#1F141A" stroke="#E24A4A" stroke-width="2" rx="8" />
  <text x="560" y="455" text-anchor="middle" class="node-text" fill="#E24A4A">Redis Session Store</text>
  <text x="560" y="475" text-anchor="middle" class="desc-text">Stateless JWT &amp; Cache</text>

  <!-- Arrows App to Redis -->
  <path d="M 550 350 L 560 430" class="arrow" />
  <path d="M 720 350 L 590 430" class="arrow" />

  <!-- DB Replication -->
  <rect x="670" y="430" width="130" height="60" class="box-db" />
  <text x="735" y="455" text-anchor="middle" class="node-text" fill="#4A90E2">DB Leader (Write)</text>
  <text x="735" y="475" text-anchor="middle" class="desc-text">PostgreSQL Primary</text>

  <rect x="830" y="430" width="130" height="60" class="box-db" />
  <text x="895" y="455" text-anchor="middle" class="node-text" fill="#4A90E2">DB Follower (Read)</text>
  <text x="895" y="475" text-anchor="middle" class="desc-text">Read Load Balanced</text>

  <!-- Arrows App to DBs -->
  <path d="M 720 350 L 735 430" class="arrow-blue" />
  <path d="M 890 350 L 895 430" class="arrow-blue" />
  
  <!-- DB Replication Arrow -->
  <path d="M 800 460 L 830 460" class="arrow-blue" stroke-dasharray="3 3" />
</svg>