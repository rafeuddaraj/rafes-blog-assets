<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <line x1="100" y1="350" x2="750" y2="350" stroke="#888888" stroke-width="2"/>
  <line x1="100" y1="50" x2="100" y2="350" stroke="#888888" stroke-width="2"/>
  <text x="425" y="380" fill="#888888" font-family="sans-serif" font-size="14" text-anchor="middle">Time</text>
  <text x="60" y="200" fill="#888888" font-family="sans-serif" font-size="14" transform="rotate(-90 60,200)" text-anchor="middle">Requests / Traffic</text>

  <!-- Synchronized Retry (Red Spike) -->
  <path d="M 100 350 L 150 350 L 170 80 L 190 350 L 250 350 L 270 120 L 290 350" stroke="#FF5555" stroke-width="2" fill="none"/>
  <text x="220" y="60" fill="#FF5555" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Synchronized Retry (Spikes)</text>

  <!-- Exponential Backoff + Jitter (Yellow smooth wave) -->
  <path d="M 350 350 C 400 320, 450 330, 500 300 C 550 280, 600 290, 650 250 C 700 220, 720 230, 750 200" stroke="#FFC83B" stroke-width="3" fill="none"/>
  <text x="550" y="180" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Exponential Backoff + Jitter</text>
  
  <!-- Server Capacity Line -->
  <line x1="100" y1="150" x2="750" y2="150" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="680" y="140" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Server Capacity</text>
</svg>
