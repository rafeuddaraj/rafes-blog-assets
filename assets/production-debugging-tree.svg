<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="100%" height="100%" fill="#0F0F0F"/>
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="300" height="50" rx="4" fill="#1A1A1A" stroke="#FF3B3B" stroke-width="2"/>
    <text x="150" y="30" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">High API Latency Alert</text>
    
    <path d="M 150 50 L 150 80" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <rect x="0" y="80" width="300" height="50" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="150" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Check DB Query Latency</text>
    
    <path d="M 150 130 L 0 180" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    <path d="M 150 130 L 300 180" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <text x="50" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Slow</text>
    <text x="250" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="12" text-anchor="middle">Normal</text>

    <rect x="-100" y="180" width="200" height="50" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="2"/>
    <text x="0" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Optimize Queries/Indexes</text>

    <rect x="200" y="180" width="200" height="50" rx="4" fill="#2A2A2A" stroke="#888888" stroke-width="2"/>
    <text x="300" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Check Connection Wait Time</text>

    <path d="M 300 230 L 300 280" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>
    
    <rect x="200" y="280" width="200" height="50" rx="4" fill="#1A1A1A" stroke="#888888" stroke-width="2"/>
    <text x="300" y="310" fill="#FFFFFF" font-family="sans-serif" font-size="14" text-anchor="middle">Check Pool Utilization</text>

    <path d="M 300 330 L 300 380" stroke="#FFFFFF" stroke-width="2" marker-end="url(#a-dn)"/>

    <rect x="150" y="380" width="300" height="50" rx="4" fill="#2A2A2A" stroke="#FFC83B" stroke-width="2"/>
    <text x="300" y="410" fill="#FFC83B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Analyze Transactions / Connection Leaks</text>
  </g>
</svg>
